<!-- Diagramas interactivos de las figuras de la ficha aprobada (Juan, 18/11/2026: «tipo imagen no, pero en html»).
     Un solo recurso dirigido por datos: index.html?f=<id> (los mismos id de salida/recursos/figura/, p. ej. jr-u1-p18).
     Texto literal de plan/figuras-texto.json (copiado en datos.js). escena.css y escena.js son copia de la base de los
     recursos de delitos ambientales; el kit es ../comun/ (paleta del curso, fuentes e iconos locales). Sin CDN. -->

<!-- Modo embebido (19/11/2026): la figura dentro de una pestaña de su lección no repite cabecera ni botón de pantalla completa.
     Se activa con ?embebido=1 (el que ponen las lecciones y entiende ../comun/kit.js) y, si falta, cuando corre en un iframe de una
     lección del curso (mismo origen con pestañas o marco de recurso, o una lección como página de origen). Insertada directamente
     en Genially no es una lección: conserva su cabecera y su botón. -->
<script>(function(){var inc=/[?&](embebido|incrustado)=1\b/.test(location.search);
if(!inc&&window.parent!==window){try{var pd=window.parent.document;inc=!!pd.querySelector('.marco-recurso,.parte-tab')||/\/leccion-\d+\//.test(window.parent.location.pathname);}catch(e){}
if(!inc&&/\/leccion-\d+\//.test(document.referrer||''))inc=true;}
if(inc)document.documentElement.classList.add('embebido');
/* Alto visible del marco (19/11/2026, qa_cortes de la U1 a 390 x 566): en la lección angosta el iframe es más alto que lo que deja
   ver el escenario; la figura se compone en el alto que de verdad se ve (--alto-visible) y lo demás se desplaza con su señal. Se vuelve a medir cuando
   cambian el marco o los contenedores de la lección (la cabecera crece con los puntos y el nivel), y cada segundo por si acaso. */
function visible(){try{var fe=window.frameElement;if(!fe)return 0;var r=fe.getBoundingClientRect();if(r.height<40)return 0;
var w=fe.ownerDocument.defaultView,b=Math.min(r.bottom,w.innerHeight);
for(var a=fe.parentElement;a&&a.nodeType===1&&a!==fe.ownerDocument.documentElement;a=a.parentElement){if(/hidden|clip|auto|scroll/.test(w.getComputedStyle(a).overflowY))b=Math.min(b,a.getBoundingClientRect().bottom);}
var h=Math.floor(b-r.top)-2;return h>=120&&h<r.height-2?h:0;}catch(e){return 0;}}
var ultimo=-1;function aplicar(avisar){var h=visible(),d=document.documentElement;if(h===ultimo)return;ultimo=h;d.classList.toggle('alto-visible',!!h);
if(h)d.style.setProperty('--alto-visible',h+'px');else d.style.removeProperty('--alto-visible');if(avisar)window.dispatchEvent(new Event('alto-visible'));}
if(inc){aplicar(false);window.addEventListener('resize',function(){aplicar(false);});setInterval(function(){aplicar(true);},1000);
try{var fe=window.frameElement,w=fe&&fe.ownerDocument.defaultView;if(w&&w.ResizeObserver){var ro=new w.ResizeObserver(function(){aplicar(true);});ro.observe(fe);for(var a=fe.parentElement;a&&a.nodeType===1;a=a.parentElement){if(/hidden|clip|auto|scroll/.test(w.getComputedStyle(a).overflowY))ro.observe(a);}}}catch(e){}}
})();</script>
