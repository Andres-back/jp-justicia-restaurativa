  // Vista ampliada (imagen a 2× de su tamaño natural, con desplazamiento libre)

  document.querySelector('[data-ampliar]').addEventListener('click', function (e) {
    volver = e.currentTarget; amp.hidden = false;
    imgAmp.style.width = Math.max(img.naturalWidth * 2, window.innerWidth) + 'px';
    amp.querySelector('[data-cerrar-amp]').focus();
  });
  function cerrarAmp() { amp.hidden = true; if (volver) volver.focus(); }
  amp.querySelector('[data-cerrar-amp]').addEventListener('click', cerrarAmp);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !amp.hidden) cerrarAmp(); });
  img.addEventListener('load', pintar); window.addEventListener('resize', pintar);
  if (img.complete) pintar();
  if (document.documentElement.classList.contains('embebido')) document.body.classList.add('embebido');
  else Kit.pantallaCompleta();
})();
</script>
</body>
</html>
