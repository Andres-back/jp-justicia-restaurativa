 de manera amplia en el presente curso.", "3. La voluntad del indiciado/procesado: comoquiera que la fiscalía debe contar, sin que per se desvirtúe la presunción de inocencia, “con un mínimo de prueba que permita inferir la autoría o participación en la conducta y su tipicidad”, (artículo 327 del CPP), la renuncia a la acción penal no es incondicionada, por tanto, le permite al o la fiscal del caso promover un ejercicio de reconocimiento del daño para una posible reparación. Esto no es contrario a la justicia restaurativa, de hecho, actúa como una ventaja para impulsar su aplicación. Así mismo, en el evento de aplicarse el principio de oportunidad en el ejercicio o derivado de un proceso restaurativo, la persona ofensora debería asumir escenarios de reparación del daño, aporte de verdad y narrativas de responsabilización.", "4. La modalidad suspensiva como condicionamiento de la renuncia, se insiste, y hasta se señaló en el glosario cuando se definió “mecanismos restaurativos”, la denominada suspensión del procedimiento a prueba cuenta con características que le permitirían ser considerado como uno de dichos mecanismos."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "La participación de la víctima", "segs": [0], "obj": "escudo"}, {"label": "La voluntad del indiciado/procesado", "segs": [1], "obj": "expediente"}, {"label": "La modalidad suspensiva", "segs": [2], "obj": "escalones"}]}], "rotulo": null, "seccion": "2.1.4. Enfoque restaurativo aplicado a diversas instituciones, figuras, actuaciones o actos procesales", "grupo": "A. El principio de oportunidad", "titulos_fuente": ["2.1.4. Enfoque restaurativo aplicado a diversas instituciones, figuras, actuaciones o actos procesales", "A. El principio de oportunidad"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["La participación de la víctima", "La voluntad del indiciado/procesado", "La modalidad suspensiva"], "titulo_genially": "A. El principio de oportunidad", "complemento_genially": "", "apartado": "2.1.4. Enfoque restaurativo aplicado a diversas instituciones, figuras, actuaciones o actos procesales", "objeto_raiz": "escudo", "objetos_raiz": ["escudo", "expediente", "personas"], "escenario": {"bioma": "despacho", "camino": "asciende"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [235, 237]}, {"layout": "mental", "segmentos": ["5. El beneficio obtenido por el indiciado/procesado frente a la acción penal puede estar condicionado a la suspensión, siempre que medie su voluntad (principio de voluntariedad). Para hacer de la suspensión del procedimiento a prueba un escenario restaurativo, es relevante que las condiciones bajo las cuales se suspende el ejercicio de la acción penal tengan en cuenta criterios de responsabilización y reparación. Será más factible, pero no excluyente, en las causales que están mediadas por un escenario de reparación, y será aplicable, desde el enfoque o perspectiva restaurativa, para las causales que, bajo el principio de mínima intervención, buscan maximizar la participación de las víctimas.", "6. Correspondencia entre daño, necesidad y reparación: las medidas propuestas deben guardar relación directa con los daños e impactos identificados, las necesidades de las víctimas y las capacidades reales de reparación del indiciado/procesado.", "7. Reparación integral y diferenciada: la reparación no deberá limitarse al componente económico. El o la fiscal del caso deberá analizar, según la naturaleza del daño, la procedencia de medidas de restitución, compensación, satisfacción, reconocimiento, reparación simbólica, rehabilitación o garantías de no repetición, procurando que respondan de manera diferenciada a los impactos ocasionados."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mental", "items": [{"label": "El beneficio obtenido por el indiciado/procesado", "segs": [0], "obj": "expediente"}, {"label": "Correspondencia entre daño, necesidad y reparación", "segs": [1], "obj": "reloj"}, {"label": "Reparación integral y diferenciada", "segs": [2], "obj": "escudo"}]}], "rotulo": null, "seccion": "2.1.4. Enfoque restaurativo aplicado a diversas instituciones, figuras, actuaciones o actos procesales", "grupo": null, "titulos_fuente": ["2.1.4. Enfoque restaurativo aplicado a diversas instituciones, figuras, actuaciones o actos procesales"], "encabezados": [], "mediacion": "Mapa mental: la idea central y sus ramas; cada rama abre su texto completo.", "rotulos": ["El beneficio obtenido por el indiciado/procesado", "Correspondencia entre daño, necesidad y reparación", "Reparación integral y diferenciada"], "titulo_genially": "Responsabilización y reparación", "complemento_genially": "", "apartado": "2.1.4. Enfoque restaurativo aplicado a diversas instituciones, figuras, actuaciones o actos procesales", "ilustracion": "jr-u2-l1-e30.webp", "arte": {"img": "jr-u2-l1-e30.webp", "pos": "centro"}, "bloques_fuente": [238, 240]}, {"layout": "fichas", "segmentos": ["De hecho, cuando en la Suspensión del Procedimiento a Prueba no es viable el cumplimiento de las condiciones enlistadas en el artículo 326 del CPP (que buena parte de ellas se relacionan con lo anterior: reparación integral y diferenciada), se pueden modificar o imponer otras, cuando se presentan los siguientes supuestos:", "Todos los interesados lo aceptan", "Se cumplen los mismos requisitos exigidos para aplicar el principio de oportunidad; y", "La modificación se somete a control de legalidad del juez de control de garantías.", "Si se necesita ampliar el término de suspensión, la prórroga procede antes del vencimiento del término otorgado y el fiscal del caso debe solicitarla ante el juez de control de garantías.", "Son relevantes esta clase de audiencias para fortalecer la aplicación efectiva de la justicia restaurativa. Audiencias preliminares de este tipo se conocen como innominadas porque no aparecen en forma expresa en la ley (artículo 154, numeral 9, del CPP), pero sí se relacionan con las audiencias enunciadas en la aludida norma (Ospina, 2018a, pp. 71-74), y la Resolución vigente de la Fiscalía General de la Nación las contempla (0-0561 de 2024).", "Como nota final, en el curso de Terminaciones anticipadas del proceso penal de la DAE se abordó de forma amplia, incluso con una visión restaurativa, el principio de oportunidad; por consiguiente, se sugiere, cuando cuenten con acceso, al acudir a la Unidad 3 del citado curso y, así, complementar de manera importante el presente subcapítulo."], "parrafo": [0, 1, 2, 3, 4, 5, 6], "vineta": [1, 2, 3, 4], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Se pueden modificar o imponer otras", "segs": [0, 1, 2, 3], "obj": "expediente", "ilustracion": "jr-u2-l1-e31.webp"}, {"label": "Ampliar el término de suspensión", "segs": [4], "obj": "reloj", "ilustracion": "jr-u2-l1-e31-i2.webp"}, {"label": "Se conocen como innominadas", "segs": [5], "obj": "tribunal", "ilustracion": "jr-u2-l1-e31-i3.webp"}, {"label": "Terminaciones anticipadas del proceso penal", "segs": [6], "obj": "documento", "ilustracion": "jr-u2-l1-e31-i4.webp"}]}], "rotulo": null, "seccion": "2.1.4. Enfoque restaurativo aplicado a diversas instituciones, figuras, actuaciones o actos procesales", "grupo": null, "titulos_fuente": ["2.1.4. Enfoque restaurativo aplicado a diversas instituciones, figuras, actuaciones o actos procesales"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Se pueden modificar o imponer otras", "Ampliar el término de suspensión", "Se conocen como innominadas", "Terminaciones anticipadas del proceso penal"], "titulo_genially": "Las condiciones enlistadas en el artículo 326", "complemento_genially": "", "apartado": "2.1.4. Enfoque restaurativo aplicado a diversas instituciones, figuras, actuaciones o actos procesales", "ilustracion": "jr-u2-l1-e31.webp", "bloques_fuente": [241, 247]}, {"layout": "lamina", "segmentos": ["En los preacuerdos (que se pueden suscribir entre la formulación de imputación/traslado del escrito de acusación, según el procedimiento ordinario o especial, y máximo hasta el momento en que la o el acusado es interrogado al comienzo del juicio oral sobre la aceptación de cargos), de la aceptación de responsabilidad por parte de la o del ciudadano procesado puede constituir un punto de partida para avanzar en el reconocimiento de la víctima, del daño ocasionado y de los impactos derivados de la conducta. Desde esta perspectiva, pueden incorporarse prácticas, procesos y/o proyectos restaurativos que complementen el contenido del preacuerdo y fortalezcan su dimensión reparadora."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "Un punto de partida", "segs": [0], "obj": "escalones", "acomp": ["documento", "carpetas"]}]}], "rotulo": null, "seccion": "2.1.4. Enfoque restaurativo aplicado a diversas instituciones, figuras, actuaciones o actos procesales", "grupo": "B. En los preacuerdos", "titulos_fuente": ["2.1.4. Enfoque restaurativo aplicado a diversas instituciones, figuras, actuaciones o actos procesales", "B. En los preacuerdos"], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["Un punto de partida"], "titulo_genially": "B. En los preacuerdos", "complemento_genially": "", "apartado": "2.1.4. Enfoque restaurativo aplicado a diversas instituciones, figuras, actuaciones o actos procesales", "ilustracion": "jr-u2-l1-e32.webp", "bloques_fuente": [249, 249]}, {"layout": "fichas", "segmentos": ["La incorporación del enfoque restaurativo permite que el preacuerdo no se limite a la obtención de una rebaja de pena, sino que se tienda a incluir compromisos de reconocimiento y medidas orientadas a reparar las necesidades de las víctimas. Para incorporar el enfoque restaurativo en la construcción del preacuerdo, se recomienda:", "a. Justificar el preacuerdo desde la caracterización del daño y las necesidades de la víctima. Para ello las finalidades de los preacuerdos son necesarios y útiles (artículo 248 del CPP), a más de las sentencias de constitucionalidad sobre el particular (por ejemplo: Sentencias C-516 de 2007 y SU-479 de 2019).", "b. Asegurar que la o el procesado comprenda que la aceptación de cargos negociada puede constituir un punto de partida para la asunción de responsabilización frente al daño ocasionado, las víctimas y la sociedad, y que aquella responsabilidad puede desarrollarse mediante acciones, prácticas, o proyectos restaurativos orientados a la responsabilización, la reparación y la no repetición.", "c. Promover la participación informada de la víctima, garantizando que conozca el alcance del preacuerdo, pueda expresar sus necesidades y expectativas y estas sean consideradas en la definición de las medidas restaurativas o reparadoras.", "d. Procurar que los compromisos acordados guarden relación directa con los daños e impactos identificados y sean proporcionales, viables y acordes con las capacidades reales de cumplimiento del procesado.", "e. Establecer, cuando se incorporen compromisos restaurativos o reparadores, mecanismos claros de cumplimiento, seguimiento y verificación que permitan valorar su ejecución efectiva. Una guía para esto la encontrarán en el desarrollo de las Unidades 3 y 4 del presente curso."], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [], "lead": [0], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Justificar el preacuerdo", "segs": [1], "obj": "libros", "ilustracion": "jr-u2-l1-e33.webp"}, {"label": "Asegurar que la o el procesado comprenda", "segs": [2], "obj": "reloj", "ilustracion": "jr-u2-l1-e33-i2.webp"}, {"label": "Promover la participación informada", "segs": [3], "obj": "escudo", "ilustracion": "jr-u2-l1-e33-i3.webp"}, {"label": "Los compromisos acordados", "segs": [4], "obj": "documento", "ilustracion": "jr-u2-l1-e33-i4.webp"}, {"label": "Mecanismos claros de cumplimiento", "segs": [5], "obj": "camara", "ilustracion": "jr-u2-l1-e33-i5.webp"}]}], "rotulo": null, "seccion": "2.1.4. Enfoque restaurativo aplicado a diversas instituciones, figuras, actuaciones o actos procesales", "grupo": null, "titulos_fuente": ["2.1.4. Enfoque restaurativo aplicado a diversas instituciones, figuras, actuaciones o actos procesales"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Justificar el preacuerdo", "Asegurar que la o el procesado comprenda", "Promover la participación informada", "Los compromisos acordados", "Mecanismos claros de cumplimiento"], "titulo_genially": "La construcción del preacuerdo", "complemento_genially": "", "apartado": "2.1.4. Enfoque restaurativo aplicado a diversas instituciones, figuras, actuaciones o actos procesales", "ilustracion": "jr-u2-l1-e33.webp", "bloques_fuente": [250, 255]}, {"layout": "giro", "segmentos": ["La preclusión por la causal 1 del artículo 332 procede desde la imputación/traslado del escrito en la fiscalía, salvo por conciliación preprocesal (archivo de las diligencias), y hasta antes del inicio de la audiencia de juicio oral.", "Para incorporar el enfoque restaurativo en la preclusión por reparación, se recomienda:", "a. Identificar previamente las necesidades y expectativas de reparación de las víctimas y considerarlas en la construcción de las medidas acordadas.", "b. Verificar el cumplimiento efectivo de la reparación y su correspondencia con los compromisos asumidos.", "c. Valorar con la víctima si las medidas ejecutadas responden a las necesidades de reparación previamente identificadas, sin que ello implique que la procedencia jurídica de la preclusión dependa exclusivamente de una manifestación subjetiva de satisfacción.", "d. Procurar que las medidas de reparación sean proporcionales al daño y a los impactos caracterizados, y compatibles con las capacidades reales de cumplimiento de la persona indiciada o procesada.", "e. Explicar a las partes, mediante un lenguaje claro y comprensible, los efectos jurídicos de la preclusión, incluida la terminación del proceso y los efectos de cosa juzgada que correspondan."], "parrafo": [0, 1, 2, 3, 4, 5, 6], "vineta": [], "lead": [0, 1], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Identificar previamente las necesidades", "segs": [2], "obj": "escudo", "ilustracion": "jr-u2-l1-e34.webp"}, {"label": "Verificar el cumplimiento efectivo", "segs": [3], "obj": "carpetas", "ilustracion": "jr-u2-l1-e34-i2.webp"}, {"label": "Valorar con la víctima", "segs": [4], "obj": "puertaCerrada", "ilustracion": "jr-u2-l1-e34-i3.webp"}, {"label": "Proporcionales al daño", "segs": [5], "obj": "reloj", "ilustracion": "jr-u2-l1-e34-i4.webp"}, {"label": "Los efectos jurídicos de la preclusión", "segs": [6], "obj": "documento", "ilustracion": "jr-u2-l1-e34-i5.webp"}]}], "rotulo": null, "seccion": "2.1.4. Enfoque restaurativo aplicado a diversas instituciones, figuras, actuaciones o actos procesales", "grupo": "C. En preclusión por reparación", "titulos_fuente": ["2.1.4. Enfoque restaurativo aplicado a diversas instituciones, figuras, actuaciones o actos procesales", "C. En preclusión por reparación"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Identificar previamente las necesidades", "Verificar el cumplimiento efectivo", "Valorar con la víctima", "Proporcionales al daño", "Los efectos jurídicos de la preclusión"], "titulo_genially": "C. En preclusión por reparación", "complemento_genially": "", "apartado": "2.1.4. Enfoque restaurativo aplicado a diversas instituciones, figuras, actuaciones o actos procesales", "ilustracion": "jr-u2-l1-e34.webp", "arte": {"img": "jr-u2-l1-e34.webp", "pos": "izq"}, "bloques_fuente": [257, 263]}, {"layout": "esquema", "segmentos": ["La incorporación del enfoque restaurativo en esta etapa permite que la acusación no se limite a una formulación técnico-jurídica de los hechos, sino que también contribuya a visibilizar, cuando resulte pertinente, los daños e impactos ocasionados y las necesidades que puedan subsistir para la víctima.", "Para incorporar el enfoque restaurativo en la acusación, se recomienda:", "a. Procurar que la relación de los hechos jurídicamente relevantes permita identificar los daños e impactos derivados de la conducta, sin perder la precisión jurídica exigida para la acusación. Cabe anotar que jurídicamente es procedente si se tiene en cuenta que no se trata de referirse a la indemnización, sino de abordar algunas de las consecuencias de la conducta delictiva (daños e impactos) que, en la acusación se deben referir y en la audiencia preparatoria/concentrada ofrecer o solicitar los medios de conocimiento que la o las acrediten, y se sustenta la pertinencia —artículo 375 del CPP— ya que, precisamente, refiere dichas consecuencias del delito en las primeras cuatro (directa, indirecta, más o menos probable) de sus cinco categorías¹⁷. ¹⁷ Ospina V., Víctor (2019).", "Pp. 45-49.Previo a la audiencia, es útil contar con el acompañamiento de equipos psicosociales que permitan identificar y gestionar las expectativas de las víctimas frente al proceso judicial, mediante espacios previos de orientación y preparación en los que se explique el alcance de la diligencia, sus posibles resultados y los efectos de la práctica temprana de pruebas, evitando generar expectativas que excedan las posibilidades reales del proceso penal. Se recomienda que la o el fiscal, cuando la prueba se practique con la víctima, incorpore en su argumentación el enfoque restaurativo, explicando las medidas adoptadas tendientes a garantizar su participación informada, prevenir la revictimización, atender sus necesidades particulares (identificar posibles escenarios de reparación) y reducir los posibles impactos derivados de la práctica de la prueba.", "b. Garantizar que la víctima cuente con la información detallada y clara sobre el contenido y alcance de la acusación, la etapa en la que se encuentra el proceso judicial, los actos procesales que siguen y las posibilidades de participación y las opciones de reparación que continúan disponibles.", "c. Informar a la víctima, cuando jurídicamente proceda, sobre los mecanismos, salidas, procesos o prácticas restaurativas que aún pueden desarrollarse antes de la audiencia de juicio oral, explicando sus alcances y efectos.", "d. Utilizar un lenguaje claro, respetuoso y asertivo durante la audiencia, especialmente al abordar hechos que puedan generar afectaciones emocionales, procurando así reducir riesgos de victimización secundaria.", "e. Continuar la identificación y caracterización del daño y de las necesidades de la víctima como insumo para las decisiones posteriores relacionadas con eventuales medidas de restablecimiento de derechos, reparación, mecanismos o acuerdos restaurativos."], "parrafo": [0, 1, 2, 4, 5, 6, 7], "vineta": [], "lead": [0, 1], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Identificar los daños e impactos", "segs": [2, 3], "obj": "reloj"}, {"label": "Información detallada y clara", "segs": [4], "obj": "escudo"}, {"label": "Informar a la víctima", "segs": [5], "obj": "tribunal"}, {"label": "Un lenguaje claro, respetuoso y asertivo", "segs": [6], "obj": "documento"}, {"label": "Continuar la identificación y caracterización", "segs": [7], "obj": "carpetas"}]}], "rotulo": null, "seccion": "2.1.4. Enfoque restaurativo aplicado a diversas instituciones, figuras, actuaciones o actos procesales", "grupo": "D. En la acusación", "titulos_fuente": ["2.1.4. Enfoque restaurativo aplicado a diversas instituciones, figuras, ac
