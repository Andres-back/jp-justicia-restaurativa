ión", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["Buenas prácticas internacionales y nacionales"], "titulo_genially": "Buenas prácticas y desafíos en la implementación", "complemento_genially": "", "apartado": "", "ilustracion": "jr-u3-l4-e01.webp", "pagina": 1, "parte": 1, "partes": 1, "pestana": "Buenas prácticas internacionales y nacionales", "bloques_fuente": [185, 185]}, {"layout": "linea", "segmentos": ["El modelo de conferencias familiares de Nueva Zelanda constituye un referente paradigmático de la justicia restaurativa, al materializar sus principios fundamentales: la responsabilización del infractor, la participación proactiva de la familia y la comunidad, y la búsqueda de reparación del daño en un marco de diálogo y consenso. Veamos en qué consiste.", "Un caso representativo es el de las conferencias familiares en Nueva Zelanda, especialmente en el sistema de justicia juvenil. Este modelo, inspirado en prácticas del pueblo Maorí, reúne al joven infractor, la víctima, sus familias y un facilitador para dialogar sobre lo ocurrido. En este espacio, el infractor reconoce su responsabilidad, se acuerdan acciones de reparación según las necesidades de la víctima y se promueve su reintegración con el apoyo de la familia y la comunidad (Maxwell & Morris, 1993).", "Estas conferencias fueron institucionalizadas mediante la Children, Young Persons, and Their Families Act 1989, que incorporó formalmente este enfoque restaurativo en el sistema de justicia juvenil. Diversos estudios han mostrado que este modelo fortalece la participación de las víctimas, fomenta la responsabilización de los infractores y contribuye a reducir la reincidencia, evidenciando la aplicación práctica de las tres R dentro de un marco legal (Zehr, 2002 o 2010)."], "parrafo": [0, 1, 2], "guia": "Recorra cada momento.", "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "linea", "items": [{"label": "Un referente paradigmático", "segs": [0], "obj": "reloj", "ilustracion": "jr-u3-l4-e02.webp"}, {"label": "Inspirado en prácticas del pueblo Maorí", "segs": [1], "obj": "escudo", "ilustracion": "jr-u3-l4-e02-i2.webp"}, {"label": "Las tres R dentro de un marco legal", "segs": [2], "obj": "expediente", "ilustracion": "jr-u3-l4-e02-i3.webp"}]}], "rotulo": null, "seccion": "3.4.1. Buenas prácticas", "grupo": "El modelo de conferencias familiares Nueva Zelanda", "titulos_fuente": ["3.4.1. Buenas prácticas", "El modelo de conferencias familiares Nueva Zelanda"], "encabezados": [], "mediacion": "Línea de tiempo: se avanza momento a momento.", "rotulos": ["Un referente paradigmático", "Inspirado en prácticas del pueblo Maorí", "Las tres R dentro de un marco legal"], "titulo_genially": "3.4.1. Buenas prácticas", "complemento_genially": "", "apartado": "3.4.1. Buenas prácticas", "ilustracion": "jr-u3-l4-e02.webp", "pagina": 2, "parte": 1, "partes": 7, "pestana": "El modelo de conferencias familiares Nueva Zelanda", "bloques_fuente": [188, 190]}, {"layout": "caso", "segmentos": ["1. ¿Qué principios de la justicia restaurativa se evidencian en el modelo de conferencias familiares?", "2. ¿Cómo se materializa la responsabilización del infractor en este modelo? ¿Es una responsabilidad impuesta o asumida?", "3. ¿De qué manera la participación de la familia y la comunidad refleja un enfoque distinto al de la justicia tradicional?", "4. ¿Por qué puede afirmarse que este modelo tiene un enfoque más dialógico que punitivo? En el contexto colombiano, ¿algún caso o experiencia que lo evidencie?"], "parrafo": [0, 1, 2, 3], "guia": "Lea cada pregunta, márquela con «Lo tendré en cuenta» y tómese un tiempo para reflexionar.", "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "caso", "roles": {"titulo": "", "parrafos": [0, 1, 2, 3]}, "obj": "documento", "items": [], "encabezado": "Actividad de reflexión", "nombre": "Buenas prácticas"}], "rotulo": null, "seccion": "3.4.1. Buenas prácticas", "grupo": "Preguntas para la reflexión:", "titulos_fuente": ["Preguntas para la reflexión:"], "encabezados": [], "mediacion": "Actividad de escritura: el caso, la consigna y el espacio para responder.", "rotulos": ["Preguntas para la reflexión"], "titulo_genially": "3.4.1. Buenas prácticas", "complemento_genially": "", "apartado": "3.4.1. Buenas prácticas", "pagina": 2, "parte": 2, "partes": 7, "pestana": "Preguntas para la reflexión: Nueva Zelanda", "bloques_fuente": [192, 195]}, {"layout": "carrusel", "segmentos": ["Un caso representativo de justicia restaurativa se desarrolló en el norte de Uganda, tras el conflicto armado con el Ejército de Resistencia del Señor (Lord’s Resistance Army). En varias comunidades del pueblo acholi se recurrió al ritual tradicional Mato Oput, un proceso en el que el ofensor reconoce públicamente el daño causado pide perdón y asume compromisos de reparación. Este encuentro es acompañado por líderes comunitarios y busca restaurar las relaciones afectadas por la violencia, más allá de una lógica exclusivamente punitiva (Baines, 2007).", "En este proceso, las víctimas tienen un papel activo, expresan el impacto del daño sufrido y participan en la construcción de acuerdos, mientras la comunidad facilita la reconciliación y la reintegración del ofensor. El ritual incluye actos simbólicos que representan el reconocimiento del daño y la voluntad de superarlo, lo que permite reconstruir el tejido social y prevenir nuevas violencias. Este caso evidencia cómo la justicia restaurativa puede operar incluso en contextos de conflicto armado, promoviendo responsabilización, reparación y reintegración (Huyse & Salter, 2008)."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "carrusel", "items": [{"label": "Ritual tradicional Mato Oput", "segs": [0], "obj": "reloj", "ilustracion": "jr-u3-l4-e04.webp"}, {"label": "Las víctimas tienen un
