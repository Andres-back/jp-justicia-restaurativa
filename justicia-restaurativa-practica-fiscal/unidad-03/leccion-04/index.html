to_genially": "", "apartado": "", "ilustracion": "jr-u3-l4-e01.webp", "bloques_fuente": [185, 185]}, {"layout": "linea", "segmentos": ["El modelo de conferencias familiares de Nueva Zelanda constituye un referente paradigmático de la justicia restaurativa, al materializar sus principios fundamentales: la responsabilización del infractor, la participación proactiva de la familia y la comunidad, y la búsqueda de reparación del daño en un marco de diálogo y consenso. Veamos en qué consiste.", "Un caso representativo es el de las conferencias familiares en Nueva Zelanda, especialmente en el sistema de justicia juvenil. Este modelo, inspirado en prácticas del pueblo Maorí, reúne al joven infractor, la víctima, sus familias y un facilitador para dialogar sobre lo ocurrido. En este espacio, el infractor reconoce su responsabilidad, se acuerdan acciones de reparación según las necesidades de la víctima y se promueve su reintegración con el apoyo de la familia y la comunidad (Maxwell & Morris, 1993).", "Estas conferencias fueron institucionalizadas mediante la Children, Young Persons, and Their Families Act 1989, que incorporó formalmente este enfoque restaurativo en el sistema de justicia juvenil. Diversos estudios han mostrado que este modelo fortalece la participación de las víctimas, fomenta la responsabilización de los infractores y contribuye a reducir la reincidencia, evidenciando la aplicación práctica de las tres R dentro de un marco legal (Zehr, 2002 o 2010)."], "parrafo": [0, 1, 2], "guia": "Recorra cada momento.", "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "linea", "items": [{"label": "Un referente paradigmático", "segs": [0], "obj": "reloj"}, {"label": "Inspirado en prácticas del pueblo Maorí", "segs": [1], "obj": "escudo"}, {"label": "Las tres R dentro de un marco legal", "segs": [2], "obj": "expediente"}]}], "rotulo": null, "seccion": "3.4.1. Buenas prácticas", "grupo": "El modelo de conferencias familiares Nueva Zelanda", "titulos_fuente": ["3.4.1. Buenas prácticas", "El modelo de conferencias familiares Nueva Zelanda"], "encabezados": [], "mediacion": "Línea de tiempo: se avanza momento a momento.", "rotulos": ["Un referente paradigmático", "Inspirado en prácticas del pueblo Maorí", "Las tres R dentro de un marco legal"], "titulo_genially": "El modelo de conferencias familiares Nueva Zelanda", "complemento_genially": "", "apartado": "3.4.1. Buenas prácticas", "ilustracion": "jr-u3-l4-e02.webp", "bloques_fuente": [188, 190]}, {"layout": "caso", "segmentos": ["1. ¿Qué principios de la justicia restaurativa se evidencian en el modelo de conferencias familiares?", "2. ¿Cómo se materializa la responsabilización del infractor en este modelo? ¿Es una responsabilidad impuesta o asumida?", "3. ¿De qué manera la participación de la familia y la comunidad refleja un enfoque distinto al de la justicia tradicional?", "4. ¿Por qué puede afirmarse que este modelo tiene un enfoque más dialógico que punitivo? En el contexto colombiano, ¿algún caso o experiencia que lo evidencie?"], "parrafo": [0, 1, 2, 3], "guia": "Lea cada pregunta, márquela y escriba su respuesta: queda guardada en este navegador.", "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "caso", "roles": {"titulo": "", "parrafos": [0, 1, 2, 3]}, "obj": "documento", "items": [], "encabezado": "Bitácora de reflexión", "nombre": "Buenas prácticas"}], "rotulo": null, "seccion": "3.4.1. Buenas prácticas", "grupo": "Preguntas para la reflexión:", "titulos_fuente": ["Preguntas para la reflexión:"], "encabezados": [], "mediacion": "Actividad de escritura: el caso, la consigna y el espacio para responder.", "rotulos": ["Preguntas para la reflexión"], "titulo_genially": "Preguntas para la reflexión", "complemento_genially": "", "apartado": "3.4.1. Buenas prácticas", "bloques_fuente": [192, 195]}, {"layout": "linea", "segmentos": ["Un caso representativo de justicia restaurativa se desarrolló en el norte de Uganda, tras el conflicto armado con el Ejército de Resistencia del Señor (Lord’s Resistance Army). En varias comunidades del pueblo acholi se recurrió al ritual tradicional Mato Oput, un proceso en el que el ofensor reconoce públicamente el daño causado pide perdón y asume compromisos de reparación. Este encuentro es acompañado por líderes comunitarios y busca restaurar las relaciones afectadas por la violencia, más allá de una lógica exclusivamente punitiva (Baines, 2007).", "En este proceso, las víctimas tienen un papel activo, expresan el impacto del daño sufrido y participan en la construcción de acuerdos, mientras la comunidad facilita la reconciliación y la reintegración del ofensor. El ritual incluye actos simbólicos que representan el reconocimiento del daño y la voluntad de superarlo, lo que permite reconstruir el tejido social y prevenir nuevas violencias. Este caso evidencia cómo la justicia restaurativa puede operar incluso en contextos de conflicto armado, promoviendo responsabilización, reparación y reintegración (Huyse & Salter, 2008)."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "linea", "items": [{"label": "Ritual tradicional Mato Oput", "segs": [0], "obj": "reloj"}, {"label": "Las víctimas tienen un papel activo", "segs": [1], "obj": "escudo"}]}], "rotulo": null, "seccion": "3.4.1. Buenas prácticas", "grupo": "El caso de Uganda y el ritual Mato Oput", "titulos_fuente": ["3.4.1. Buenas prácticas", "El caso de Uganda y el ritual Mato Oput"], "encabezados": [], "mediacion": "Línea de tiempo: se avanza momento a momento.", "rotulos": ["Ritual tradicional Mato Oput", "Las víctimas tienen un papel activo"], "titulo_genially": "El caso de Uganda y el ritual Mato Oput", "complemento_genially": "", "apartado": "3.4.1. Buenas prácticas", "ilustracion": "jr-u3-l4-e04.webp", "bloques_fuente": [197, 198]}, {"layout": "caso", "segmentos": ["1. ¿Cómo responde el ritual a las necesidades de las víctimas, más allá de la reparación material?", "2. ¿De qué manera se abordan las necesidades del infractor en términos de responsabilidad y reintegración?", "3. ¿Qué papel cumple la comunidad en la satisfacción de las necesidades colectivas y en la reconciliación?", "4. ¿Por qué es importante que la justicia restaurativa considere simultáneamente las necesidades de todos los actores?"], "parrafo": [0, 1, 2, 3], "guia": "Lea cada pregunta, márquela y escriba su respuesta: queda guardada en este navegador.", "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "caso", "roles": {"titulo": "", "parrafos": [0, 1, 2, 3]}, "obj": "documento", "items": [], "encabezado": "Bitácora de reflexión", "nombre": "Buenas prácticas"}], "rotulo": null, "seccion": "3.4.1. Buenas prácticas", "grupo": "Preguntas para la reflexión:", "titulos_fuente": ["Preguntas para la reflexión:"], "encabezados": [], "mediacion": "Actividad de escritura: el caso, la consigna y el espacio para responder.", "rotulos": ["Preguntas para la reflexión"], "titulo_genially": "Preguntas para la reflexión", "complemento_genially": "", "apartado": "3.4.1. Buenas prácticas", "bloques_fuente": [200, 203]}, {"layout": "lamina", "segmentos": ["La Jurisdicción Especial para la Paz implementa la justicia transicional restaurativa en sus diferentes macrocasos. A continuación, se comparten dos vídeos en los que se da cuenta de los procesos restaurativos adelantados en los Macrocasos 01 y 03."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "La justicia transicional restaurativa", "segs": [0], "obj": "documento", "acomp": ["carpetas", "lupa"]}]}], "rotulo": null, "seccion": "3.4.1. Buenas prácticas", "grupo": "Los procesos restaurativos de la Jurisdicción Especial para la Paz", "titulos_fuente": ["3.4.1. Buenas prácticas", "Los procesos restaurativos de la Jurisdicción Especial para la Paz"], "encabezados": "arte": {"img": "jr-u3-l4-e08.webp", "pos": "centro"}, "bloques_fuente": [213, 215]}, {"layout": "fichas", "segmentos": ["Las condiciones personales, familiares y sociales que pueden afectar el proceso restaurativo, como consumo problemático, amenazas, inestabilidad emocional severa o presiones del entorno.", "La ausencia de reconocimiento del daño o de responsabilización.", "La incorporación intempestiva de nuevas o nuevos servidores públicos o instituciones, especialmente durante las etapas de encuentro, pues puede afectar la intimidad y la confianza construidas con las personas participantes.", "La dificultad de hacer compatibles los compromisos restaurativos con los recursos y circunstancias reales del caso, lo que puede producir promesas incumplibles o medidas que pierdan su sentido reparador. Para evitar esto se hace necesaria la creación de un número importante de Programas de Justicia Restaurativa a nivel nacional. Un ejemplo real es el Programa Distrital de Justicia Restaurativa para Adultos de la Subdirección de Acceso a la Justicia de la Secretaría de Seguridad, Convivencia y Justicia de la Alcaldía Mayor de Bogotá que, pese a sus múltiples limitaciones de diverso orden, es un paso hacia el camino correcto."], "parrafo": [0, 1, 2, 3], "vineta": [0, 1, 2, 3], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Presiones del entorno", "segs": [0], "obj": "personas", "ilustracion": "jr-u3-l4-e09.webp"}, {"label": "La ausencia de reconocimiento del daño", "segs": [1], "obj": "reloj", "ilustracion": "jr-u3-l4-e09-i2.webp"}, {"label": "Nuevos servidores públicos o instituciones", "segs": [2], "obj": "escudo", "ilustracion": "jr-u3-l4-e09-i3.webp"}, {"label": "Hacer compatibles los compromisos restaurativos", "segs": [3], "obj": "documento", "ilustracion": "jr-u3-l4-e09-i4.webp"}]}], "rotulo": null, "seccion": "3.4.2. Posibles desafíos en la implementación", "grupo": null, "titulos_fuente": ["3.4.2. Posibles des
