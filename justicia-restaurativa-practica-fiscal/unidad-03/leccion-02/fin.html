<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fin de la lección 3.2</title>
<link rel="stylesheet" href="../comun/assets/vendor/fontawesome.min.css">
<link rel="stylesheet" href="../comun/assets/vendor/solid.min.css">
<style>
@font-face{font-family:Montserrat;src:url('../comun/assets/fonts/montserrat-latin.woff2') format('woff2');font-weight:400 800;font-display:swap}
@font-face{font-family:Montserrat;src:url('../comun/assets/fonts/montserrat-latin-ext.woff2') format('woff2');font-weight:400 800;font-display:swap;unicode-range:U+0100-02AF}
:root{--carbon:#1E4260;--negro:#1E4260;--amarillo:#F2D1CD;--cielo:#F2D1CD;--teal:#486781;--naranja:#B5563D}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--cielo);font-family:Montserrat,Arial,sans-serif;color:var(--carbon)}
.meta{position:relative;height:100vh;min-height:360px;overflow:hidden;container-type:inline-size}
.fondo{position:absolute;inset:0;width:100%;height:100%}
.nube{fill:#fff;animation:nube 14s ease-in-out 1 both}.nube.b{animation-duration:19s}
@keyframes nube{0%,100%{transform:translateX(-46px)}50%{transform:translateX(46px)}}
.sol{fill:#E8B5A5;transform-box:fill-box;transform-origin:center;animation:sol 2.5s ease-in-out 2}
@keyframes sol{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.camino{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-dasharray:1 16;animation:paso 1.8s linear 2}
@keyframes paso{to{stroke-dashoffset:-34}}
.caminante{offset-path:path('M300 324 C400 316 470 332 560 324 C620 318 660 322 690 314');offset-rotate:0deg;animation:llega 3s cubic-bezier(.3,.7,.3,1) .3s both}
@keyframes llega{from{offset-distance:0%}to{offset-distance:100%}}
/* La ilustración de la lección, en la meta */
.hito{position:absolute;right:3.2%;top:6%;width:32%;aspect-ratio:1/.86;border-radius:50% 50% 16px 16px;background:#fff;border:3px solid var(--negro);box-shadow:6px 7px 0 var(--negro);overflow:hidden;display:grid;place-items:center;animation:sube .8s cubic-bezier(.2,1.25,.4,1) .2s both}
.hito img{width:100%;height:100%;object-fit:contain;padding:12px 12px 6px;display:block}
@keyframes sube{from{opacity:0;transform:translateY(26px) scale(.9)}to{opacity:1;transform:none}}
.bandera{position:absolute;right:calc(3.2% + 15%);top:calc(6% - 34px);width:52px;height:56px;color:var(--naranja);transform-origin:left bottom;animation:ondea 2s ease-in-out 2}
@keyframes ondea{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
/* Tarjeta */
.tarjeta{position:absolute;left:3.2%;top:8%;width:55%;background:#fff;border:3px solid var(--negro);box-shadow:7px 8px 0 var(--negro);border-radius:6px;padding:20px 26px 20px;animation:sube .7s cubic-bezier(.2,1.1,.4,1) both}
.etq{display:inline-block;background:#D2DAE2;color:var(--negro);font-size:17px;font-weight:800;padding:3px 12px;border-radius:4px}
h1{margin:9px 0 3px;font-size:40px;line-height:1.08;font-weight:800;color:var(--negro)}
.frase{margin:0 0 14px;font-size:15.5px;font-weight:500;line-height:1.35}
.logros{display:grid;grid-template-columns:1.05fr .85fr;gap:12px;align-items:stretch}
.dato{border:2px solid var(--carbon);border-radius:8px;padding:9px 13px;display:flex;gap:11px;align-items:center;min-width:0}
.dato i{font-size:27px;color:var(--teal);flex:none}
.dato.nivel i{color:#B5563D;animation:medalla 1s cubic-bezier(.2,1.5,.4,1) 1.2s both}
@keyframes medalla{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.dato small{display:block;font-size:12.5px;font-weight:600}
.dato b{display:block;font-size:20px;font-weight:800;line-height:1.15;color:var(--negro)}
.tramos{margin:13px 0 0;display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700}
.tramos span{flex:1;height:9px;max-width:42px;border-radius:5px;background:#ECD5CF;overflow:hidden;position:relative}
.tramos span.ok::after{content:"";position:absolute;inset:0;background:var(--teal);transform-origin:left;animation:llena .4s ease both;animation-delay:calc(1s + var(--i)*.07s)}
@keyframes llena{from{transform:scaleX(0)}to{transform:none}}
.tramos em{font-style:normal;margin-left:6px;white-space:nowrap}
/* Escala de niveles (19/11/2026, pasada de gamificación: en lugar del confeti, que la DAE no admite, el estudiante ve dónde
   está en la progresión del curso y cuánto le falta para el siguiente nivel). Una sola animación al llegar, sin bucles. */
.escala{display:flex;gap:6px;margin:12px 0 0;padding:0;list-style:none}
.escala li{flex:1;min-width:0;font-size:11.5px;font-weight:700;line-height:1.2;text-align:center;padding:5px 4px;border-radius:4px;background:#ECD5CF;color:var(--negro)}
.escala li.ok{background:var(--negro);color:#fff}
.escala li.aqui{box-shadow:0 0 0 2px #fff,0 0 0 4px #B5563D;animation:aqui .6s cubic-bezier(.2,1.4,.4,1) 1.6s both}
@keyframes aqui{from{transform:scale(.85)}to{transform:none}}
.siguiente{margin:8px 0 0;font-size:13px;font-weight:600;line-height:1.3}
.siguiente i{color:#B5563D;margin-right:5px}
/* Pie con el curso y la unidad (JP, 11/11/2026: «tiene que ir el nombre del curso y la unidad»; estándar de ambiental) */
.pie{position:absolute;left:0;right:0;bottom:0;min-height:68px;background:#fff;border-top:3px solid var(--negro);display:flex;align-items:center;justify-content:space-between;gap:28px;padding:8px 3.2%}
.pie div{display:flex;align-items:center;gap:12px;min-width:0}
/* El centro del pie queda libre para el botón «Pantalla completa» del SCORM (x 528–700 sobre 1200; sesión de Moodle, 19/11/2026):
   el curso termina antes del 42 % y «Unidad N» empieza en el 63,2 %, como en el pie de Genially (x = 758). */
.pie .curso{flex:0 1 auto;max-width:38.8%}.pie .unidad{position:absolute;left:63.2%;right:3.2%;top:0;bottom:0;justify-content:flex-start;text-align:left}
.pie .chip{flex:none;background:var(--negro);color:#fff;font-size:14px;font-weight:700;padding:4px 10px;border-radius:3px}
.pie .unidad .chip{background:var(--teal)}
.pie p{margin:0;font-size:13.5px;line-height:1.25;font-weight:700;color:var(--negro)}
@container (max-width:640px){.hito,.bandera{display:none}.tarjeta{left:12px;right:12px;width:auto;top:12px;padding:15px 16px}h1{font-size:30px}.logros{grid-template-columns:1fr}
  .pie{flex-direction:column;align-items:stretch;gap:6px;padding:8px 12px}.pie .curso{max-width:none}.pie .unidad{position:static;justify-content:flex-start;text-align:left;flex-direction:row}.pie p{font-size:12.5px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.caminante{offset-distance:100%}}
</style>
</head>
<body>
<main class="meta">
<svg class="fondo" viewBox="0 0 1113 448" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
  <rect width="1113" height="448" fill="#F2D1CD"/>
  <circle class="sol" cx="685" cy="65" r="30"/>
  <g class="nube"><ellipse cx="660" cy="48" rx="44" ry="13"/><ellipse cx="690" cy="38" rx="26" ry="15"/></g>
  <g class="nube b"><ellipse cx="1000" cy="28" rx="34" ry="10"/></g>
  <path d="M0 300 V190 h70 v48 h54 v-80 h60 v60 h50 v40 h66 v-70 h44 v-36 h58 v96 h62 v-54 h48 v30 h70 v-88 h56 v64 h60 v-30 h52 v50 h66 v-74 h58 v44 h60 v-56 h59 V448 H0 Z" fill="#D2DAE2" opacity=".7"/>
  <rect x="0" y="300" width="1113" height="60" fill="#D1A29C"/>
  <rect x="0" y="360" width="1113" height="88" fill="#8FA3B5"/><path d="M40 404 H1073" stroke="#FFFFFF" stroke-width="5" stroke-dasharray="38 30" opacity=".8" fill="none"/>
  <path class="camino" d="M300 332 C400 324 470 340 560 332 C620 326 660 330 690 322"/>
  <g class="caminante"><ellipse cx="0" cy="26" rx="13" ry="4" fill="#1E4260" opacity=".3"/><circle cx="0" cy="-16" r="8" fill="#1E4260"/><path d="M-8 24 L-5 -6 Q0 -10 5 -6 L8 24 Z" fill="#B5563D"/></g>
</svg>
<div class="hito"><img src="../comun/ilustraciones-restaurativa/jr-u3-l2-portada.webp" alt=""></div>
<svg class="bandera" viewBox="0 0 52 56" aria-hidden="true"><path d="M4 56V4" stroke="#1E4260" stroke-width="4" stroke-linecap="round"/><path d="M6 6h40l-10 11 10 11H6z" fill="currentColor"/></svg>
<section class="tarjeta">
  <span class="etq">Lección 3.2</span>
  <h1>Fin de la lección</h1>
  <p class="frase" id="frase"></p>
  <div class="logros">
    <div class="dato nivel"><i class="fas fa-medal" aria-hidden="true"></i><div><small>Nivel alcanzado</small><b id="nivel">Observador</b></div></div>
    <div class="dato"><i class="fas fa-star" aria-hidden="true"></i><div><small>Puntos de esta lección</small><b><span id="puntos">0</span></b></div></div>
  </div>
  <div class="tramos" id="tramos" role="img"></div>
  <ol class="escala" id="escala" aria-label="Niveles del curso"></ol>
  <p class="siguiente" id="siguiente"></p>
</section>
<footer class="pie">
  <div class="curso"><span class="chip">Curso</span><p>Justicia restaurativa en la práctica del fiscal</p></div>
  <div class="unidad"><span class="chip">Unidad 3</span><p>Implementación de la justicia restaurativa</p></div>
</footer>
</main>
<script>
(function(){
 var CLAVE='jr-juego-u3-l2',MAX=725,TOTAL=13,N=['Observador','Analista','Facilitador','Constructor de acuerdos'],s={};
 try{s=JSON.parse(localStorage.getItem(CLAVE)||'{}')}catch(e){}
 var v=Object.keys(s.v||{}).length,t=Object.keys(s.t||{}).length,p=v*10+t*25,f=p/MAX,k=f>=.8?3:f>=.45?2:f>=.15?1:0,$=function(i){return document.getElementById(i)};
 $('nivel').textContent=N[k];
 $('frase').textContent=p>0?(t>=TOTAL?'Completó todos los tramos de este recorrido.':'Llegó a la meta. Si vuelve a las páginas pendientes, puede sumar más puntos.'):'Recorra las páginas de esta lección para sumar puntos y subir de nivel.';
 var h='';for(var i=0;i<TOTAL;i++)h+='<span class="'+(i<t?'ok':'')+'" style="--i:'+i+'"></span>';
 $('tramos').innerHTML=h+'<em>'+Math.min(t,TOTAL)+' de '+TOTAL+' tramos</em>';$('tramos').setAttribute('aria-label',Math.min(t,TOTAL)+' de '+TOTAL+' tramos superados');
 var q=matchMedia('(prefers-reduced-motion:reduce)').matches;
 if(q)$('puntos').textContent=p;else{var ini=performance.now();(function c(a){var x=Math.min(1,(a-ini)/1500);$('puntos').textContent=Math.round(p*x);if(x<1)requestAnimationFrame(c)})(ini);}
 var U=[0,.15,.45,.8],e='';for(var n=0;n<N.length;n++)e+='<li class="'+(n<=k?'ok':'')+(n===k?' aqui':'')+'"'+(n===k?' aria-current="step"':'')+'>'+N[n]+'</li>';$('escala').innerHTML=e;
 $('siguiente').innerHTML=k<N.length-1?'<i class="fas fa-flag" aria-hidden="true"></i>Le faltan '+Math.max(1,Math.ceil(U[k+1]*MAX)-p)+' puntos para el nivel «'+N[k+1]+'».':'<i class="fas fa-flag-checkered" aria-hidden="true"></i>Alcanzó el nivel más alto de esta lección.';
})();
</script>
</body>
</html>
