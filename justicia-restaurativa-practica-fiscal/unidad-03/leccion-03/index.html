<script type="application/json" id="contenido">{"ilustraciones": "ilustraciones-restaurativa", "paleta": {"marino": "#1E4260", "teal": "#486781", "oxido": "#B5563D", "coral": "#D16C4B", "crema": "#F2D1CD", "niebla": "#D2DAE2", "hielo": "#ECD5CF", "celeste": "#738CA3", "madera": "#853629", "piso": "#D1A29C", "gris": "#8FA3B5", "amarillo": "#E3A793"}, "anclas": {}, "respiro": 360, "pagina": 500, "partesSiNoCabe": true, "letraCompleta": 14, "letraMax": 15, "entradaVisible": true, "ventanaSinRepetir": true, "extractoMin": 240, "juego": {"clave": "jr-juego-u3-l3", "niveles": ["Observador", "Analista", "Facilitador", "Constructor de acuerdos"], "logroActividad": "¡Logro: actividad resuelta!"}, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "jr", "partirComas": true, "bitacora": true, "rellenoHoja": true, "filaOpciones": 3, "preguntaDosColumnas": 130, "retro": {"reacciones": ["u2-dialogo.webp", "u1-escalera.webp"], "frases": ["¿Seguro?", "¡Revise de nuevo!", "¡Mire otra vez!", "¡Casi!"], "acierto": ["manos-choque.webp"], "rotulo": "Unidad 3 · Lección 3.3"}, "leccion_rotulo": "Lección 3.3", "paginas": [[0, 1], [2, 3, 4]], "ventanaAmplia": true, "unit": 3, "lesson": 3, "heading": "Lección 3.3. Seguimiento y evaluación de los procesos restaurativos", "scenes": [{"layout": "compara", "segmentos": ["Una vez inician los espacios de preparación y se llevan a cabo los encuentros entre los participantes (de haberlos acordado), el o la fiscal deberá velar, directamente, a través de su equipo o con el apoyo de la Unidad de Justicia Restaurativa , por el mantenimiento de las condiciones de voluntariedad, seguridad y no revictimizaciones identificadas en la valoración restaurativa de las partes. Para ello es importante, que la ruta trazada contemple las medidas de acompañamiento y protección necesarias.", "En esta etapa de seguimiento, es posible que, surtidos los espacios de preparación de cara a un encuentro entre las partes, la persona facilitadora/mediadora determine que un encuentro restaurativo, en definitiva, no sería recomendable. Sin embargo, descartar el encuentro directo no implica necesariamente dar por terminado el proceso, pues pueden explorarse otras modalidades de intervención, como los diálogos indirectos o diferidos."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compara", "items": [{"label": "El mantenimiento de las condiciones", "segs": [0], "obj": "carpetas"}, {"label": "Descartar el encuentro directo", "segs": [1], "obj": "camara"}]}], "rotulo": null, "seccion": "3.3.1. Seguimiento del proceso restaurativo", "grupo": null, "titulos_fuente": ["3.3.1. Seguimiento del proceso restaurativo"], "encabezados": [], "mediacion": "Comparador: columnas lado a lado; la que se toca se ensancha con su texto completo.", "rotulos": ["El mantenimiento de las condiciones", "Descartar el encuentro directo"], "titulo_genially": "3.3.1. Seguimiento del proceso restaurativo", "complemento_genially": "", "apartado": "3.3.1. Seguimiento del proceso restaurativo", "ilustracion": "jr-u3-l3-e01.webp", "arte": {"img": "jr-u3-l3-e01.webp", "pos": "fondo"}, "pagina": 1, "parte": 1, "partes": 2, "pestana": "Introducción", "bloques_fuente": [171, 172]}, {"layout": "esquema", "segmentos": ["Es necesario contrastar lo que se acordó con las condiciones reales de ejecución, revisando si las acciones previstas son efectivamente realizables en los tiempos, con los recursos y en las circunstancias actuales del caso. Esto implica revisar posibles ajustes operativos antes o durante la puesta en marcha, para evitar promesas incumplibles y asegurar que las medidas conserven su sentido reparador.", "Asimismo, se debe coordinar la participación de las entidades públicas o privadas que hayan sido llamadas a apoyar el proceso (por ejemplo, servicios de salud, programas psicosociales, de formación, empleo o servicios comunitarios), definiendo con claridad quién hace qué, en qué plazo y por qué canal se reportan los avances.", "Para ello, se organiza como una secuencia de pasos planificados que permiten llevar el proceso restaurativo de la formulación a la acción, garantizando orden, seguimiento y posibilidad de ajuste. Comienza con la socialización operativa del plan con los actores involucrados: víctima, persona indiciada/procesada, equipo de justicia restaurativa y la red articulada de instituciones. La activación permanente y sostenida de la red es fundamental de principio a fin en el proceso. Continúa con la ejecución escalonada de las actividades previstas y se complementa con espacios periódicos de revisión para valorar avances y resolver obstáculos.", "El cierre de la fase de construcción se da con el encuentro restaurativo (en caso de existir) y la finalización de la estrategia jurídica (por ejemplo, la modalidad de renuncia del principio de oportunidad, luego de la suspensión del procedimiento a prueba). En particular, cuando, tras una serie de diálogos, se alcanzan acuerdos restaurativos."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Contrastar lo que se acordó", "segs": [0], "obj": "documento"}, {"label": "Coordinar la participación de las entidades", "segs": [1], "obj": "telefono"}, {"label": "De la formulación a la acción", "segs": [2], "obj": "camara"}, {"label": "Se alcanzan acuerdos restaurativos", "segs": [3], "obj": "expediente"}]}], "rotulo": null, "seccion": "3.3.1. Seguimiento del proceso restaurativo", "grupo": null, "titulos_fuente": ["3.3.1. Seguimiento del proceso restaurativo"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Contrastar lo que se acordó", "Coordinar la participación de las entidades", "De la formulación a la acción", "Se alcanzan acuerdos restaurativos"], "titulo_genially": "3.3.1. Seguimiento del proceso restaurativo", "complemento_genially": "", "apartado": "3.3.1. Seguimiento del proceso restaurativo", "ilustracion": "jr-u3-l3-e02.webp", "arte": {"img": "jr-u3-l3-e02.webp", "pos": "izq"}, "escenario": {"bioma": "fiscalia", "camino": "asciende"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "pagina": 1, "parte": 2, "partes": 2, "pestana": "Una secuencia de pasos planificados", "bloques_fuente": [173, 176]}, {"layout": "compara", "segmentos": ["Como se mencionó, durante la implementación del proceso restaurativo en la fase de construcción se realizan espacios de seguimiento con víctimas (en especial, para brindar confianza, acompañamiento y confirmar la voluntariedad), con ofensores (para dar cuenta de sus transformaciones, brindar acompañamiento, crear confianza) y con los demás actores que participen del proceso. Estas reuniones no necesariamente deben estar a cargo de la o del fiscal, aunque este puede participar en ellas.", "El seguimiento puede combinar encuentros presenciales o virtuales, revisión documental (informes, constancias, registros de participación) y, cuando resulte conveniente, espacios de diálogo con la víctima y la persona indiciada/procesada.. Estos mecanismos permiten contrastar lo planificado con lo realizado y determinar si se requieren ajustes. De esta manera se asegura que la implementación del proceso sea sostenible, continua, verificable y adaptable a las necesidades del caso."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compara", "items": [{"label": "Espacios de seguimiento", "segs": [0], "obj": "camara"}, {"label": "Contrastar lo planificado con lo realizado", "segs": [1], "obj": "escudo"}]}], "rotulo": null, "seccion": "3.3.2. Evaluación del proceso restaurativo", "grupo": null, "titulos_fuente": ["3.3.2. Evaluación del proceso restaurativo"], "encabezados": [], "mediacion": "Comparador: columnas lado a lado; la que se toca se ensancha con su texto completo.", "rotulos": ["Espacios de seguimiento", "Contrastar lo planificado con lo realizado"], "titulo_genially": "3.3.2. Evaluación del proceso restaurativo", "complemento_genially": "", "apartado": "3.3.2. Evaluación del proceso restaurativo", "pagina": 2, "parte": 1, "partes": 3, "pestana": "Introducción", "bloques_fuente": [178, 179]}, {"layout": "mental", "segmentos": ["Durante el proceso restaurativo se realizan una serie de mediciones que posibiliten evaluar la transformación de los actores que pasan por el proceso restaurativo. Este sistema de medición se compone de un diccionario cualitativo que permite establecer los conceptos sobre las categorías de medición y una batería de indicadores que permite transformar el marco conceptual en un sistema medible durante el mencionado proceso.", "Este sistema de medición se articula con la batería de indicadores por nivel cognitivo, emocional y conductual que ha venido definiendo la Unidad Nacional de Justicia Restaurativa, de manera que la evaluación de cada caso individual alimente, de forma consistente, el seguimiento agregado de los resultados restaurativos de la citada Unidad Nacional.", "En particular, los indicadores de responsabilización permiten valorar el avance de la persona indiciada/procesada en la comprensión de los hechos, el reconocimiento de su participación, la identificación del daño y sus impactos y la disposición para asumir activamente sus consecuencias. En cualquier caso, la valoración del proceso restaurativo parte de entender que no es solo un trámite de cierre, sino un momento clave para verificar la calidad restaurativa de todo el proceso."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mental", "items": [{"label": "Evaluar la transformación de los actores", "segs": [0], "obj": "documento"}, {"label": "Nivel cognitivo, emocional y conductual", "segs": [1], "obj": "camara"}, {"label": "Los indicadores de responsabilización", "segs": [2], "obj": "reloj"}]}], "rotulo": null, "seccion": "3.3.2. Evaluación del proceso restaurativo", "grupo": null, "titulos_fuente": ["3.3.2. Evaluación del proceso restaurativo"], "encabezados": [], "mediacion": "Mapa mental: la idea central y sus ramas; cada rama abre su texto completo.", "rotulos": ["Evaluar la transformación de los actores", "Nivel cognitivo, emocional y conductual", "Los indicadores de responsabilización"], "titulo_genially": "3.3.2. Evaluación del proceso restaurativo", "complemento_genially": "", "apartado": "3.3.2. Evaluación del proceso restaurativo", "ilustracion": "jr-u3-l3-e04.webp", "arte": {"img": "jr-u3-l3-e04.webp", "pos": "centro"}, "pagina": 2, "parte": 2, "partes": 3, "pestana": "Sistema de medición", "bloques_fuente": [180, 182]}, {"layout": "lamina", "segmentos": ["Finalmente, el enfoque incluye la comunicación oportuna y clara a la autoridad judicial competente, dependiendo del mecanismo o institución (relacionada con la justicia restaurativa) seleccionada, sobre el estado del proceso restaurativo y los resultados del seguimiento. A partir de esta información, la o el juez adopta los proveídos que correspondan, valorando el aporte del proceso restaurativo frente a los fines del proceso penal y los avances logrados en términos de reparación, responsabilización y reintegración."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "La autoridad judicial competente", "segs": [0], "obj": "telefono", "acomp": ["camara", "tribunal"]}]}], "rotulo": null, "seccion": "3.3.2. Evaluación del proceso restaurativo", "grupo": null, "titulos_fuente": ["3.3.2. Evaluación del proceso restaurativo"], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["La autoridad judicial competente"], "titulo_genially": "3.3.2. Evaluación del proceso restaurativo", "complemento_genially": "", "apartado": "3.3.
