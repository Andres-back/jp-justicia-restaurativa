<script type="application/json" id="contenido">{"ilustraciones": "ilustraciones-restaurativa", "paleta": {"marino": "#1E4260", "teal": "#486781", "oxido": "#B5563D", "coral": "#D16C4B", "crema": "#F2D1CD", "niebla": "#D2DAE2", "hielo": "#ECD5CF", "celeste": "#738CA3", "madera": "#853629", "piso": "#D1A29C", "gris": "#8FA3B5", "amarillo": "#E3A793"}, "anclas": {}, "respiro": 360, "pagina": 400, "juego": {"clave": "jr-juego-u4-l1", "niveles": ["Observador", "Analista", "Facilitador", "Constructor de acuerdos"], "logroActividad": "¡Logro: actividad resuelta!"}, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "jr", "partirComas": true, "bitacora": true, "rellenoHoja": true, "filaOpciones": 3, "preguntaDosColumnas": 130, "retro": {"reacciones": ["u2-dialogo.webp", "u1-escalera.webp"], "frases": ["¿Seguro?", "¡Revise de nuevo!", "¡Mire otra vez!", "¡Casi!"], "acierto": ["manos-choque.webp"], "rotulo": "Unidad 4 · Lección 4.1"}, "leccion_rotulo": "Lección 4.1", "unit": 4, "lesson": 1, "heading": "Lección 4.1. Identificación de los elementos y las categorías propias de un plan de justicia restaurativa (daño, impacto, expectativa, necesidad y propuesta de reparación)", "scenes": [{"layout": "linea", "segmentos": ["Usted sigue en su oficina, Juana también. Se da cuenta de que ella ya se terminó su agua. Juana sigue pensando en su respuesta sobre el perdón… Usted le ofrece otro agua o café. Ella le agradece, pero no quiere nada. Por el contrario, todavía dubitativa sobre la justicia restaurativa, aprovecha para preguntarle: “¿Para qué la justicia restaurativa? “Es decir”, le dice, “¿por qué le resultaría mejor a mi primo acudir a la justicia restaurativa?”", "Usted, fiscal, se sirve otro café y toma un libro que tiene sobre su escritorio. El libro se titula “Daño y silencio” de Carlos Thiebaut. Usted procede a leerle un fragmento:", "Aprender el sufrimiento y aprender a atenderlo al concebir esa conducta, precisamente, como doliente es, en un grado cero, aprender a nombrarlo, tal vez por vez primera. Dar una imagen, un nombre, a algo que todavía no lo tenía es, en gran medida, haber sabido fijarlo en un concepto o en un lenguaje y poder, entonces, ubicarlo en un tejido de significados que nos permitan comprenderlo como pena o como dolor; en virtud de ello, quienes están junto al doliente pueden llegar a verse concernidos por ese dolor y responder a la demanda que plantea. Las palabras, pues, permiten nombrar los dolores y las penas y permiten comprenderlas como daños, como aquello que debe ser atendido y, cuando posible sea, como aquello que debe ser evitado."], "parrafo": [0, 1, 2], "guia": "Recorra el ejemplo momento a momento.", "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "linea", "items": [{"label": "¿Para qué la justicia restaurativa?", "segs": [0], "obj": "documento", "ilustracion": "jr-u4-l1-e01.webp"}, {"label": "Daño y silencio", "segs": [1, 2], "obj": "camara", "ilustracion": "jr-u4-l1-e01-i2.webp"}]}], "rotulo": null, "seccion": "Culminamos la situación con diversas reflexiones…", "grupo": null, "titulos_fuente": ["Culminamos la situación con diversas reflexiones…"], "encabezados": [], "mediacion": "Línea de tiempo: se avanza momento a momento.", "rotulos": ["¿Para qué la justicia restaurativa?", "Daño y silencio"], "titulo_genially": "Nombrar los dolores y las penas", "complemento_genially": "", "apartado": "Culminamos la situación con diversas reflexiones…", "ilustracion": "jr-u4-l1-e01.webp", "bloques_fuente": [15, 17]}, {"layout": "esquema", "segmentos": ["Juana, cansada de tantas frases, le dice que no entiende, le pide que sea más práctico. “¿Cómo es que a punta de palabras la justicia restaurativa puede ayudar a mi primo?”, le indaga con insistencia.", "Usted, persistente, procede a leerle otro fragmento:", "Pero el daño no solo reclama palabras. Demanda también acciones. Atender al reclamo de un dolor, sanarlo o paliarlo, es hacer algo en el mundo; aquello, precisamente, que las palabras han nombrado o aquello que los conceptos que empleamos nos han indicado que debe ser curado, atendido, o evitado.", "Requiere, por decirlo de manera concreta, transitar de la pragmática de los silencios a su ética. El silencio, por ejemplo, dice que en algunos casos no hay ya cura posible para un daño que se sufrió o que todavía no la hay. Fija lo irrecuperable, entonces, lo que no puede suturarse del daño sufrido pero reconoce, no obstante, que debería haber sido o que debería ser otro el curso del mundo. El silencio pone una marca que recuerda que ya no hay sutura en el daño o en la pérdida sufridos, pero a la vez impone otra marca, la de un motivo o un compromiso, la de un deseo o un imperativo de no reiteración del daño."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Que sea más práctico", "segs": [0], "obj": "documento"}, {"label": "El daño no solo reclama palabras", "segs": [1, 2, 3], "obj": "reloj"}]}], "rotulo": null, "seccion": "Culminamos la situación con diversas reflexiones…", "grupo": null, "titulos_fuente": ["Culminamos la situación con diversas reflexiones…"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Que sea más práctico", "El daño no solo reclama palabras"], "titulo_genially": "Hacer algo en el mundo", "complemento_genially": "", "apartado": "Culminamos la situación con diversas reflexiones…", "objeto_raiz": "reloj", "objetos_raiz": ["reloj", "documento", "carpetas"], "escenario": {"bioma": "barrio", "camino": "asciende"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [18, 21]}, {"layout": "linea", "segmentos": ["Juana le agradece por la lectura, pero no parece muy convencida de la ruta restaurativa. “Me parece muy fuerte someter a mi primo a todo eso. ¿Para qué cavar y cavar y escarbar en el dolor?”, le dice.", "Usted le responde que justo por eso, por lo que implica lidiar con el dolor y con lo atroz, lo fundamental en la justicia restaurativa es la voluntariedad. “Nadie está obligado a avanzar por ese camino. Pero quien emprende ese camino tampoco está solo. De ahí la importancia de las personas mediadoras o facilitadoras. Se trata de terceros que son cuidadosos, que se encargan de llevar el proceso. ¿Usted leyó la Divina Comedia?”, le pregunta a Juana.", "“Sí, pero la leí en el colegio, hace mucho tiempo ya”, le responde.", "“Tal vez recuerde que en la primera parte, Infierno, Dante recorre los nueve círculos del Infierno, viendo las imágenes y los horrores más atroces…”", "“Ajá…”, le responde Juana, confundida. “¿Eso qué tiene que ver con la justicia restaurativa?”, le pregunta.", "“Pues, señora Juana, Dante logra regresar del Infierno gracias a que va acompañado por Virgilio. Virgilio es su guía, lo orienta, le advierte, le muestra el camino. Eso, señora Juana, es lo que hace un mediador”.", "“Tan poético usted”, le responde Juana y ambos se ríen. “Lo comentaré con mi primo y le cuento, doctor(a). Muchas gracias”, le dice y se levanta de su silla.", "Usted, fiscal, antes de que ella se vaya, le explica que la ruta restaurativa, a diferencia de la ruta ordinaria:..."], "parrafo": [0, 1, 2, 3, 4, 5, 6, 7], "guia": "Recorra cada momento.", "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "linea", "items": [{"label": "Escarbar en el dolor", "segs": [0], "obj": "documento", "ilustracion": "jr-u4-l1-e03.webp"}, {"label": "Nadie está obligado a avanzar", "segs": [1], "obj": "personas", "ilustracion": "jr-u4-l1-e03-i2.webp"}, {"label": "Virgilio es su guía", "segs": [2, 3, 4, 5], "obj": "carpetas", "ilustracion": "jr-u4-l1-e03-i3.webp"}, {"label": "A diferencia de la ruta ordinaria", "segs": [6, 7], "obj": "lupa", "ilustracion": "jr-u4-l1-e03-i4.webp"}]}], "rotulo": null, "seccion": "Culminamos la situación con diversas reflexiones…", "grupo": null, "titulos_fuente": ["Culminamos la situación con diversas reflexiones…"], "encabezados": [], "mediacion": "Línea de tiempo: se avanza momento a momento.", "rotulos": ["Escarbar en el dolor", "Nadie está obligado a avanzar", "Virgilio es su guía", "A diferencia de la ruta ordinaria"], "titulo_genially": "Lo que hace un mediador", "complemento_genially": "", "apartado": "Culminamos la situación con diversas reflexiones…", "ilustracion": "jr-u4-l1-e03.webp", "bloques_fuente": [22, 29]}, {"layout": "fichas", "segmentos": ["Como se vio en la Unidad 2, la identificación del daño, el impacto, las necesidades y los intereses de los participantes es fundamental para dar inicio al proceso restaurativo. En este punto, se revisará cómo estos componentes deben ser atendidos en el plan de justicia restaurativa, esto es, cómo es que las posibles propuestas de reparación efectivamente atienden dichos criterios.", "Se trata, de hecho, del resultado restaurativo que el artículo 518, inciso 2, de la Ley 906 de 2004 define como: “aquel orientado a atender las necesidades y responsabilidades individuales y colectivas de las partes, procurar la reintegración de las personas afectadas y promover la reparación, la restitución y el servicio a la comunidad”. Sin una caracterización rigurosa del daño, el impacto, las necesidades y las expectativas de la víctima, ese resultado restaurativo carece de un punto de partida verificable.", "De entrada, vale la pena señalar que para que una propuesta de reparación sea viable, debe cumplir, fundamentalmente, tres condiciones: proporcionalidad frente al daño identificado; correspondencia con las capacidades reales —no solo la voluntad— de la persona indiciada/procesada; y verificabilidad, es decir, la posibilidad de constatar objetivamente su cumplimiento. La verificabilidad exige que los compromisos se formulen bajo criterios de especificidad, medición, pertinencia y temporalidad, en coherencia con estándares de comportamientos verificables.", "Ahora bien, es posible que, debido a condiciones personales, económicas o sociales, la persona indiciada/procesada no cuente con los recursos suficientes para responder plenamente a las expectativas de la víctima. Ello no la exime de su deber de asumir las consecuencias del daño causado; por el contrario, el enfoque restaurativo implica que la persona indiciada/procesada reconozca su responsabilización y realice esfuerzos reales para ampliar sus posibilidades de reparación. Así, el plan de reparación no solo refleja lo que es posible, sino también lo que es justo, proporcional y transformador, promoviendo compromisos significativos que contribuyan a la dignificación de la víctima y al proceso de cambio de la persona ofensora."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Cómo estos componentes deben ser atendidos", "segs": [0], "obj": "reloj", "ilustracion": "jr-u4-l1-e04.webp"}, {"label": "El resultado restaurativo", "segs": [1], "obj": "libros", "ilustracion": "jr-u4-l1-e04-i2.webp"}, {"label": "Tres condiciones", "segs": [2], "obj": "personas", "ilustracion": "jr-u4-l1-e04-i3.webp"}, {"label": "Lo que es justo, proporcional y transformador", "segs": [3], "obj": "escudo", "ilustracion": "jr-u4-l1-e04-i4.webp"}]}], "rotulo": null, "seccion": "Lección 4.1. Identificación de los elementos y las categorías propias de un plan de justicia restaurativa (daño, impacto, expectativa, necesidad y propuesta de reparación)", "grupo": null, "titulos_fuente": ["Lección 4.1. Identificación de los elementos y las categorías propias de un plan de justicia restaurativa (daño, impacto, expectativa, necesidad y propuesta de reparación)"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Cómo estos componentes deben ser atendidos", "El resultado restaurativo", "Tres condiciones", "Lo que es justo, proporcional y transformador"], "titulo_genially": "Las posibles propuestas de reparación", "complemento_genially": "", "apartado": "", "ilustracion": "jr-u4-l1-e04.webp", "bloques_fuente": [31, 34]}, {"layout": "esquema", "segmentos": ["Las propuestas pueden ser de diferentes tipos (el listado no es taxativo):", "Acciones directas y/o simbólicas, siempre proporcionales al daño y a los impactos identificados.", "La persona indiciada/procesada puede expresar arrepentimiento, ofrecer disculpas o manifestar su compromiso de reparación como parte de un ejercicio voluntario de responsabilización. Estas expresiones no constituyen una condición para la validez del proceso restaurativo, ni implican exigir, esperar o condicionar el perdón de la víctima. La decisión de perdonar, guardar silencio, aceptar o no una disculpa pertenece exclusivamente a la víctima y debe respetar sus tiempos, necesidades y autonomía.", "Programas terapéuticos y/o educativos, orientados a promover cambios en las personas indiciadas/procesadas y/o a satisfacer las necesidades de apoyo para las víctimas.", "Procesos de formación orientados al manejo del conflicto en contextos familiares, comunitarios, laborales y/o sociales.", "Procesos de formación en gestión emocional, cuando se identifica que esta vía contribuye de manera significativa al cambio.", "Compromisos orientados a garantizar la no repetición, que incluyan la vinculación de redes y comunidades de apoyo para acompañar y sostener el proceso en el tiempo."], "parrafo": [0, 1, 2, 3, 4, 5, 6], "vineta": [1, 2, 3, 4, 5, 6], "lead": [0], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Acciones directas y/o simbólicas", "segs": [1, 2], "obj": "reloj"}, {"label": "Programas terapéuticos y/o educativos", "segs": [3], "obj": "escudo"}, {"label": "Manejo del conflicto", "segs": [4], "obj": "documento"}, {"label": "Gestión emocional", "segs": [5], "obj": "carpetas"}, {"label": "Garantizar la no repetición", "segs": [6], "obj": "lupa"}]}], "rotulo": null, "seccion": "4.1.1. Tipos y criterios de reparación", "grupo": null, "titulos_fuente": ["4.1.1. Tipos y criterios de reparación"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Acciones directas y/o simbólicas", "Programas terapéuticos y/o educativos", "Manejo del conflicto", "Gestión emocional", "Garantizar la no repetición"], "titulo_genially": "Tipos y criterios de reparación", "complemento_genially": "", "apartado": "4.1.1. Tipos y criterios de reparación", "objeto_raiz": "reloj", "objetos_raiz": ["reloj", "personas", "documento"], "escenario": {"bioma": "sala", "camino": "asciende"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [37, 43]}, {"layout": "fichas", "segmentos": ["Por su parte, los tipos de reparación a considerar son:", "Material: acciones orientadas a compensar, restituir y/o reparar afectaciones económicas, patrimoniales o físicas derivadas del delito, con base en criterios objetivos y proporcionales al daño causado. Pueden incluir compensaciones económicas, restitución de bienes, asunción de gastos y/o cumplimiento de obligaciones relacionadas directamente con la afectación ocasionada.", "Emocional: acciones orientadas al reconocimiento y validación del impacto emocional producido por el delito, así como a contribuir a la disminución de afectaciones asociadas al miedo, la rabia, la frustración, la desesperanza u otras emociones derivadas del daño. Cuando se comprometan la autonomía, la identidad o el proyecto de vida, podrán incluir medidas dirigidas a fortalecer la capacidad de agencia, favorecer procesos de resignificación y apoyar la recuperación del control sobre el presente y el futuro.", "Relacional: acciones orientadas a reparar y/o transformar las relaciones afectadas por el delito, mediante la construcción de acuerdos sobre formas de interacción, límites, responsabilidades y condiciones de convivencia. Pueden incluir pautas de comunicación, acuerdos de contacto o distanciamiento, reconstrucción progresiva de confianza y fortalecimiento de relaciones basadas en el respeto, la seguridad y el trato digno.", "Simbólica: acciones de reconocimiento con significado para la víctima, construidas a partir de su historia, identidad, necesidades y de las características del daño ocasionado. Pueden incluir actos de reconocimiento, disculpas, rectificaciones, acciones de memoria u otras medidas orientadas a dignificar a la víctima, reconocer pública o privadamente el daño y favorecer procesos de cierre o resignificación.", "Comunitaria o social: acciones orientadas a reconocer y reparar afectaciones que trascienden a la víctima individual y comprometen a una comunidad, grupo social, redes de apoyo, familiares y/o dinámicas de convivencia. Pueden incluir actividades comunitarias, procesos formativos, acciones de reconocimiento colectivo, campañas preventivas, espacios de diálogo y otras iniciativas dirigidas a reconstruir confianza, fortalecer vínculos y contribuir a la recuperación del tejido social.", "Institucional: acciones orientadas a reconocer y reparar las afectaciones generadas por la conducta sobre el funcionamiento, la legitimidad, la confianza, la imagen o las relaciones de una institución o persona jurídica. Pueden comprender actos de reconocimiento, medidas correctivas, fortalecimiento de procedimientos, acciones de transparencia y compromisos orientados a prevenir la repetición.", "Ambiental: acciones orientadas a reconocer, mitigar, restaurar y/o compensar las afectaciones causadas al ambiente y a sus distintos componentes, incluidos los ecosistemas, los recursos naturales, la fauna y la flora, entre otros. Pueden comprender medidas de recuperación, restauración, protección, compensación, prevención y acciones colectivas directamente relacionadas con el daño ocasionado.", "Las modalidades de reparación descritas no son taxativas ni excluyentes entre sí. Podrán combinarse dentro de un mismo plan restaurativo o complementarse con otras formas de reparación que resulten pertinentes, siempre que cumplan con los estándares restaurativos de voluntariedad, proporcionalidad, viabilidad, verificabilidad y guarden correspondencia con la naturaleza del daño, los impactos identificados, las necesidades de la víctima y las capacidades reales de reparación de la persona indiciada/procesada."], "parrafo": [0, 1, 2, 3, 4, 5, 6, 7, 8], "vineta": [1, 2, 3, 4, 5, 6, 7], "lead": [0], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Material", "segs": [1], "obj": "reloj", "ilustracion": "jr-u4-l1-e06.webp"}, {"label": "Emocional", "segs": [2], "obj": "documento", "ilustracion": "jr-u4-l1-e06-i2.webp"}, {"label": "Relacional", "segs": [3], "obj": "telefono", "ilustracion": "jr-u4-l1-e06-i3.webp"}, {"label": "Simbólica", "segs": [4], "obj": "escudo", "ilustracion": "jr-u4-l1-e06-i4.webp"}, {"label": "Comunitaria o social", "segs": [5], "obj": "carpetas", "ilustracion": "jr-u4-l1-e06-i5.webp"}, {"label": "Institucional", "segs": [6], "obj": "camara", "ilustracion": "jr-u4-l1-e06-i6.webp"}, {"label": "Ambiental", "segs": [7], "obj": "lupa", "ilustracion": "jr-u4-l1-e06-i7.webp"}, {"label": "No son taxativas ni excluyentes", "segs": [8], "obj": "expediente", "ilustracion": "jr-u4-l1-e06-i8.webp"}]}], "rotulo": null, "seccion": "4.1.1. Tipos y criterios de reparación", "grupo": null, "titulos_fuente": ["4.1.1. Tipos y criterios de reparación"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Material", "Emocional", "Relacional", "Simbólica", "Comunitaria o social", "Institucional", "Ambiental", "No son taxativas ni excluyentes"], "titulo_genially": "Los tipos de reparación a considerar", "complemento_genially": "", "apartado": "4.1.1. Tipos y criterios de reparación", "ilustracion": "jr-u4-l1-e06.webp", "bloques_fuente": [44, 52]}, {"layout": "lamina", "segmentos": ["Ejemplo:", "Los paneles víctima–ofensor en Estados Unidos constituyen un modelo restaurativo que sitúa la voz de la víctima, como corresponde, en el centro del proceso restaurativo, permitiendo visibilizar de manera directa el impacto emocional, psicológico y social del delito. A través de su dicho, se reconoce que el daño va más allá de la infracción legal, afectando profundamente la vida de las personas y generando la necesidad de ser escuchadas, validadas y reparadas."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "Ser escuchadas, validadas y reparadas", "segs": [0, 1], "obj": "reloj", "acomp": ["escudo", "documento"]}]}], "rotulo": null, "seccion": "4.1.1. Tipos y criterios de reparación", "grupo": null, "titulos_fuente": ["4.1.1. Tipos y criterios de reparación"], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["Ser escuchadas, validadas y reparadas"], "titulo_genially": "Un modelo restaurativo", "complemento_genially": "", "apartado": "4.1.1. Tipos y criterios de reparación", "ilustracion": "jr-u4-l1-e07.webp", "bloques_fuente": [53, 54]}, {"layout": "linea", "segmentos": ["En varios estados de Estados Unidos se han implementado Programas de Diálogo Víctima-Ofensor, especialmente en delitos graves. En estos, se realizan encuentros con un ofensor que ha cometido el mismo delito del que la persona fue víctima, pero no está vinculado a su caso. La participación de la víctima es voluntaria y activa: puede expresar el impacto del delito, hacer preguntas al ofensor y participar en la definición de formas de reparación. Este espacio permite que la víctima recupere voz y control dentro del proceso, más allá del rol pasivo del sistema penal tradicional (Umbreit et al., 2007).", "Estos programas han demostrado que cuando las víctimas participan directamente, se fortalecen procesos de reconocimiento, reparación emocional y cierre, al tiempo que se promueve la responsabilización del ofensor (Zehr, 2002 o 2010).", "El caso de los diálogos víctima–ofensor en Estados Unidos muestra que la justicia restaurativa cobra verdadero sentido cuando la víctima deja de ser un actor pasivo y asume un papel central en el proceso restaurativo. A través del diálogo, el ofensor reconoce el daño causado y se abren posibilidades de reparación, especialmente en el plano emocional y simbólico."], "parrafo": [0, 1, 2], "guia": "Recorra cada momento.", "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "linea", "items": [{"label": "Programas de Diálogo Víctima-Ofensor", "segs": [0], "obj": "escudo", "ilustracion": "jr-u4-l1-e08.webp"}, {"label": "Cuando las víctimas participan directamente", "segs": [1], "obj": "documento", "ilustracion": "jr-u4-l1-e08-i2.webp"}, {"label": "Deja de ser un actor pasivo", "segs": [2], "obj": "reloj", "ilustracion": "jr-u4-l1-e08-i3.webp"}]}], "rotulo": null, "seccion": "4.1.1. Tipos y criterios de reparación", "grupo": "Los paneles víctima–ofensor en Estados Unidos: la voz de la víctima en el centro", "titulos_fuente": ["4.1.1. Tipos y criterios de reparación", "Los paneles víctima–ofensor en Estados Unidos: la voz de la víctima en el centro"], "encabezados": [], "mediacion": "Línea de tiempo: se avanza momento a momento.", "rotulos": ["Programas de Diálogo Víctima-Ofensor", "Cuando las víctimas participan directamente", "Deja de ser un actor pasivo"], "titulo_genially": "Los paneles víctima–ofensor en Estados Unidos: la voz de la víctima en el centro", "complemento_genially": "", "apartado": "4.1.1. Tipos y criterios de reparación", "ilustracion": "jr-u4-l1-e08.webp", "bloques_fuente": [56, 58]}, {"layout": "caso", "segmentos": ["1. ¿Cómo influye la posibilidad de expresar el daño en la percepción de justicia de las víctimas?", "2. ¿De qué manera el reconocimiento del daño por parte del infractor contribuye a su comprensión del impacto causado?", "3. ¿Por qué es importante que el daño sea escuchado en un espacio seguro y personal?", "4. ¿En qué se diferencia esta forma de abordar el daño frente a la justicia penal tradicional?"], "parrafo": [0, 1, 2, 3], "guia": "Lea cada pregunta, márquela y escriba su respuesta: queda guardada en este navegador.", "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "caso", "roles": {"titulo": "", "parrafos": [0, 1, 2, 3]}, "obj": "documento", "items": [], "encabezado": "Bitácora de reflexión", "nombre": "Tipos y criterios de reparación"}], "rotulo": null, "seccion": "4.1.1. Tipos y criterios de reparación", "grupo": "Preguntas para la reflexión:", "titulos_fuente": ["Preguntas para la reflexión:"], "encabezados": [], "mediacion": "Actividad de escritura: el caso, la consigna y el espacio para responder.", "rotulos": ["Preguntas para la reflexión"], "titulo_genially": "Preguntas para la reflexión", "complemento_genially": "", "apartado": "4.1.1. Tipos y criterios de reparación", "bloques_fuente": [60, 63]}, {"layout": "esquema", "segmentos": ["Se trata de una herramienta que aplica la Unidad Nacional de Justicia Restaurativa, que permite relacionar los daños e impactos identificados con las posibles modalidades de reparación, facilitando la construcción de respuestas comprensibles y pertinentes para las partes. Su utilización tiene carácter orientador y no implica que a cada impacto corresponda una única forma de reparación.", "El punto de partida es la pregunta: ¿Cuál es el daño y cuáles son los impactos que requieren ser atendidos?", "A partir de su caracterización, se podrá identificar una modalidad principal de reparación y, cuando resulte pertinente, complementar con otras medidas. La selección deberá considerar las necesidades de la víctima, las capacidades reales de reparación de la persona indiciada/procesada y los estándares de voluntariedad, proporcionalidad, pertinencia, viabilidad y verificabilidad. En cualquier caso, es importante tener en cuenta que los acuerdos en torno a la reparación nacen en los espacios dialógicos entre las partes. El árbol de decisión sirve como orientación metodológica, pero, se insiste, no como criterio de determinación definitiva para una reparación en concreto."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Carácter orientador", "segs": [0], "obj": "reloj"}, {"label": "Una modalidad principal de reparación", "segs": [1, 2], "obj": "escudo"}]}], "rotulo": null, "seccion": "4.1.1. Tipos y criterios de reparación", "grupo": "Árbol de decisión sobre los tipos de reparación", "titulos_fuente": ["4.1.1. Tipos y criterios de reparación", "Árbol de decisión sobre los tipos de reparación"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Carácter orientador", "Una modalidad principal de reparación"], "titulo_genially": "Árbol de decisión sobre los tipos de reparación", "complemento_genially": "", "apartado": "4.1.1. Tipos y criterios de reparación", "objeto_raiz": "reloj", "objetos_raiz": ["reloj", "documento", "carpetas"], "escenario": {"bioma": "barrio", "camino": "llano"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [65, 67]}, {"layout": "cuadro", "segmentos": ["Impacto identificado", "Modalidad principal sugerida", "Modalidades complementarias", "Ejemplos de acciones", "Económico o patrimonial", "Material", "Simbólica", "Restitución, compensación, devolución de bienes, acuerdos de pago o asunción de gastos asociados al daño.", "Físico", "Material", "Emocional", "Asunción de gastos relacionados con la afectación, apoyos para procesos de recuperación y acciones de reconocimiento del daño.", "Seguridad y control sobre el entorno", "Relacional", "Emocional mplemento_genially": "", "apartado": "4.1.1. Tipos y criterios de reparación", "guia": "Desplácese dentro de la tabla para leer todas sus filas.", "bloques_fuente": [75, 76]}, {"layout": "ruta", "segmentos": ["El árbol constituye una herramienta orientadora para la construcción del plan restaurativo y no busca establecer una fórmula automática e inflexible de correspondencia entre daño y reparación. Su función es orientar el razonamiento restaurativo. Para su utilización se recomienda:", "1. Partir de la naturaleza del delito y del daño causado. La caracterización deberá identificar qué bienes, personas, relaciones, comunidades, instituciones o entornos resultaron afectados y de qué manera.", "2. Identificar los impactos concretos. Un mismo delito puede generar afectaciones en varias dimensiones, tangible, subjetiva, relacional, social, institucional o ambiental, y estas pueden presentarse con diferente intensidad.", "3. Traducir las expectativas en necesidades de reparación. Las expectativas y los impactos expresados por la víctima deberán ser comprendidas y trabajadas para identificar qué necesidades concretas requieren ser atendidas, evitando construir el plan únicamente a partir de solicitudes iniciales o respuestas predeterminadas.", "4. Relacionar la necesidad con la modalidad de reparación. Una vez identificada la necesidad, se seleccionarán las modalidades que puedan responder de manera más adecuada al impacto. La modalidad señalada como principal en el árbol es orientadora y puede complementarse o sustituirse por otras.", "5. Contrastar las necesidades con las capacidades de reparación. Las acciones deberán construirse considerando las posibilidades reales de la persona indiciada/procesada, sin que ello implique desconocer el daño ni reducir la reparación a lo que inicialmente resulte más fácil de cumplir.", "6. Definir acciones concretas y verificables. La modalidad de reparación deberá traducirse en compromisos específicos, proporcionales, pertinentes, viables y susceptibles de seguimiento y verificación.", "7. Incorporar la no repetición de manera transversal. El plan deberá identificar, cuando corresponda, los factores relacionados con la ocurrencia del hecho y establecer acciones dirigidas a intervenirlos y reducir el riesgo de repetición."], "parrafo": [0, 1, 2, 3, 4, 5, 6, 7], "vineta": [], "lead": [0], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "ruta", "items": [{"label": "Partir de la naturaleza del delito", "segs": [1], "obj": "reloj", "ilustracion": "jr-u4-l1-e14.webp"}, {"label": "Identificar los impactos concretos", "segs": [2], "obj": "documento", "ilustracion": "jr-u4-l1-e14-i2.webp"}, {"label": "Traducir las expectativas en necesidades", "segs": [3], "obj": "escudo", "ilustracion": "jr-u4-l1-e14-i3.webp"}, {"label": "Relacionar la necesidad con la modalidad", "segs": [4], "obj": "carpetas", "ilustracion": "jr-u4-l1-e14-i4.webp"}, {"label": "Contrastar las necesidades con las capacidades", "segs": [5], "obj": "personas", "ilustracion": "jr-u4-l1-e14-i5.webp"}, {"label": "Definir acciones concretas y verificables", "segs": [6], "obj": "camara", "ilustracion": "jr-u4-l1-e14-i6.webp"}, {"label": "Incorporar la no repetición", "segs": [7], "obj": "lupa", "ilustracion": "jr-u4-l1-e14-i7.webp"}]}], "rotulo": null, "seccion": "4.1.1. Tipos y criterios de reparación", "grupo": "Criterios para utilizar el árbol", "titulos_fuente": ["4.1.1. Tipos y criterios de reparación", "Criterios para utilizar el árbol"], "encabezados": [], "mediacion": "Ruta paso a paso con ficha que avanza.", "rotulos": ["Partir de la naturaleza del delito", "Identificar los impactos concretos", "Traducir las expectativas en necesidades", "Relacionar la necesidad con la modalidad", "Contrastar las necesidades con las capacidades", "Definir acciones concretas y verificables", "Incorporar la no repetición"], "titulo_genially": "Criterios para utilizar el árbol", "complemento_genially": "", "apartado": "4.1.1. Tipos y criteri
