<script type="application/json" id="contenido">{"ilustraciones": "ilustraciones-restaurativa", "paleta": {"marino": "#1E4260", "teal": "#486781", "oxido": "#B5563D", "coral": "#D16C4B", "crema": "#F2D1CD", "niebla": "#D2DAE2", "hielo": "#ECD5CF", "celeste": "#738CA3", "madera": "#853629", "piso": "#D1A29C", "gris": "#8FA3B5", "amarillo": "#E3A793"}, "anclas": {}, "respiro": 360, "pagina": 400, "juego": {"clave": "jr-juego-u4-l3", "niveles": ["Observador", "Analista", "Facilitador", "Constructor de acuerdos"]}, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "jr", "partirComas": true, "bitacora": true, "rellenoHoja": true, "filaOpciones": 3, "preguntaDosColumnas": 130, "retro": {"reacciones": ["u2-dialogo.webp", "u1-escalera.webp"], "frases": ["¿Seguro?", "¡Revise de nuevo!", "¡Mire otra vez!", "¡Casi!"], "acierto": ["manos-choque.webp"], "rotulo": "Unidad 4 · Lección 4.3"}, "leccion_rotulo": "Lección 4.3", "unit": 4, "lesson": 3, "heading": "Lección 4.3. Monitoreo o seguimiento del plan de justicia restaurativa y cierre del proceso restaurativo (Indicadores)", "scenes": [{"layout": "esquema", "segmentos": ["El plan de justicia restaurativa requiere de la activación de una ruta que contemple varios encuentros de monitoreo o seguimiento, ajuste y retroalimentación. Esto incluye, además, el uso de instrumentos sencillos como listas de chequeo, matrices de cumplimiento e indicadores previamente definidos (plazos, frecuencia, calidad de las actividades, percepciones de la víctima), que permiten registrar qué se ha hecho, cómo se ha hecho y qué efectos se van observando. Se contemplan, en particular, las siguientes acciones:", "Realización de diálogos colaborativos entre las entidades públicas e instituciones privadas y equipos involucrados, para coordinar acciones y resolver obstáculos de implementación.", "Desarrollo de las actividades previstas en el plan restaurativo con el acompañamiento de las entidades e instituciones aliadas, según los roles asignados.", "Programación de encuentros restaurativos de seguimiento, cuando proceda, para revisar avances con la víctima y con la persona investigada y ajustar acciones.", "Los espacios de retroalimentación -individuales o interinstitucionales- sirven para revisar los avances, se identifican dificultades y se acuerdan ajustes razonables sin desnaturalizar el sentido reparador de las acciones."], "parrafo": [0, 1, 2, 3, 4], "vineta": [1, 2, 3], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "La activación de una ruta", "segs": [0, 1, 2, 3], "obj": "camara"}, {"label": "Los espacios de retroalimentación", "segs": [4], "obj": "documento"}]}], "rotulo": null, "seccion": "Lección 4.3. Monitoreo o seguimiento del plan de justicia restaurativa y cierre del proceso restaurativo (Indicadores)", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["La activación de una ruta", "Los espacios de retroalimentación"], "titulo_genially": "Encuentros de monitoreo o seguimiento", "complemento_genially": "", "apartado": "", "objeto_raiz": "camara", "objetos_raiz": ["camara", "documento", "carpetas"], "escenario": {"bioma": "despacho", "camino": "llano"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [126, 130]}, {"layout": "mental", "segmentos": ["En esta etapa se busca realizar una evaluación integral del proceso restaurativo, examinando hasta qué punto las acciones previstas en el plan de reparación fueron ejecutadas y en qué medida respondieron efectivamente a las necesidades priorizadas por la víctima. A partir de esta valoración se definen los pasos finales: ajustes si aún fueran necesarios, reconocimiento formal de los logros alcanzados y adopción de las decisiones jurídicas de cierre del caso.", "El monitoreo se orienta, en primer lugar, a contrastar lo acordado con lo efectivamente realizado, verificando la coherencia entre los compromisos asumidos y las acciones desplegadas por el investigado y por las entidades involucradas. Esto implica revisar evidencias de cumplimiento, recoger la percepción de la víctima sobre el grado de satisfacción de sus necesidades y valorar si las medidas implementadas han contribuido a su seguridad, estabilización y proyecto de vida. La verificación incluye también identificar obstáculos surgidos durante la ejecución y, cuando sea pertinente, realizar ajustes razonables antes de declarar el cierre del plan.", "La fase de monitoreo y cierre con las personas procesadas u ofensoras tiene como énfasis tres verbos: participar, verificar y concluir. Participar implica asegurar que tanto el indiciado/procesado como las entidades involucradas asumen un rol activo y documentado en la ejecución y seguimiento o monitoreo del plan. Verificar supone contrastar compromisos, tiempos y resultados con evidencias concretas: reportes del ofensor, insumos de las víctimas y soportes documentales. Concluir implica identificar barreras, valorar el nivel de reintegración logrado y formular recomendaciones para el cierre jurídico y, si procede, para la continuidad de apoyos por fuera del dispositivo Restaurativa."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mental", "items": [{"label": "Una evaluación integral", "segs": [0], "obj": "escudo"}, {"label": "Lo acordado con lo efectivamente realizado", "segs": [1], "obj": "expediente"}, {"label": "Participar, verificar y concluir", "segs": [2], "obj": "camara"}]}], "rotulo": null, "seccion": "Lección 4.3. Monitoreo o seguimiento del plan de justicia restaurativa y cierre del proceso restaurativo (Indicadores)", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa mental: la idea central y sus ramas; cada rama abre su texto completo.", "rotulos": ["Una evaluación integral", "Lo acordado con lo efectivamente realizado", "Participar, verificar y concluir"], "titulo_genially": "La fase de monitoreo y cierre", "complemento_genially": "", "apartado": "", "bloques_fuente": [131, 133]}, {"layout": "giro", "segmentos": ["Al final, los resultados esperados son:", "Que los compromisos contenidos en el plan restaurativo se encuentren sustancialmente cumplidos, de manera verificable y acorde con lo acordado.", "Que existan bases suficientes para adoptar las decisiones jurídicas de cierre del caso, incorporando los resultados del proceso restaurativo.", "Que, cuando sea pertinente, se gestione la autorización para utilizar el caso como insumo para análisis, sistematización o estudio, con fines investigativos o de mejora de la práctica de la Unidad Nacional de Justicia Restaurativa, respetando siempre la confidencialidad y los derechos de las partes."], "parrafo": [0, 1, 2, 3], "vineta": [1, 2, 3], "lead": [0], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "Sustancialmente cumplidos", "segs": [1], "obj": "documento"}, {"label": "Las decisiones jurídicas de cierre", "segs": [2], "obj": "carpetas"}, {"label": "Utilizar el caso como insumo", "segs": [3], "obj": "lupa"}]}], "rotulo": null, "seccion": "Lección 4.3. Monitoreo o seguimiento del plan de justicia restaurativa y cierre del proceso restaurativo (Indicadores)", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["Sustancialmente cumplidos", "Las decisiones jurídicas de cierre", "Utilizar el caso como insumo"], "titulo_genially": "Los resultados esperados", "complemento_genially": "", "apartado": "", "bloques_fuente": [134, 137]}, {"layout": "fichas", "segmentos": ["Existen, además, una serie de indicadores que contribuyen a identificar el impacto del proceso restaurativo en su conjunto. Estos indicadores han de atender a los tres ejes de la justicia restaurativa: responsabilización, reparación y reintegración. A continuación, se condensan los Indicadores que ha ido considerando o recolectando la Unidad Nacional de Justicia Restaurativa de la FGN.:", "Indicadores de responsabilización", "Se enfocan en la comprensión de los hechos, el reconocimiento de la participación y del daño, así como la disposición para asumir el impacto de la conducta."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Los tres ejes de la justicia restaurativa", "segs": [0], "obj": "documento"}, {"label": "Indicadores de responsabilización", "segs": [1, 2], "obj": "reloj"}]}], "rotulo": null, "seccion": "Lección 4.3. Monitoreo o seguimiento del plan de justicia restaurativa y cierre del proceso restaurativo (Indicadores)", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Los tres ejes de la justicia restaurativa", "Indicadores de responsabilización"], "titulo_genially": "Impacto del proceso restaurativo", "complemento_genially": "", "apartado": "", "bloques_fuente": [138, 140]}, {"layout": "lamina", "segmentos": ["Indicadores de reparación", "Se enfocan en la correspondencia entre los daños, las necesidades y las medidas acordadas, así como su ejecución efectiva."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "Indicadores de reparación", "segs": [0, 1], "obj": "reloj", "acomp": ["carpetas", "documento"]}]}], "rotulo": null, "seccion": "Lección 4.3. Monitoreo o seguimiento del plan de justicia restaurativa y cierre del proceso restaurativo (Indicadores)", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["Indicadores de reparación"], "titulo_genially": "Indicadores de reparación", "complemento_genially": "", "apartado": "", "bloques_fuente": [145, 146]}, {"layout": "lamina", "segmentos": ["Indicadores de reintegración", "Los indicadores de reintegración permiten valorar si los avances alcanzados en responsabilización y reparación se traducen en condiciones sostenibles de participación social, fortalecimiento de redes, seguridad y no repetición. Se observan en las dimensiones cognitiva, emocional y conductual, tanto en la persona indiciada o procesada como en la víctima, teniendo en cuenta que la reintegración no implica necesariamente restablecer los vínculos existentes antes de los hechos."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "Indicadores de reintegración", "segs": [0, 1], "obj": "escudo", "acomp": ["personas", "documento"]}]}], "rotulo": null, "seccion": "Lección 4.3. Monitoreo o seguimiento del plan de justicia restaurativa y cierre del proceso restaurativo (Indicadores)", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["Indicadores de reintegración"], "titulo_genially": "Indicadores de reintegración", "complemento_genially": "", "apartado": "", "bloques_fuente": [151, 152]}]}</script>
