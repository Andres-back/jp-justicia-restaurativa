<script type="application/json" id="contenido">{"ilustraciones": "ilustraciones-restaurativa", "paleta": {"marino": "#1E4260", "teal": "#486781", "oxido": "#B5563D", "coral": "#D16C4B", "crema": "#F2D1CD", "niebla": "#D2DAE2", "hielo": "#ECD5CF", "celeste": "#738CA3", "madera": "#853629", "piso": "#D1A29C", "gris": "#8FA3B5", "amarillo": "#E3A793"}, "anclas": {}, "respiro": 360, "pagina": 400, "juego": {"clave": "jr-juego-u1-l3", "niveles": ["Observador", "Analista", "Facilitador", "Constructor de acuerdos"]}, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "jr", "partirComas": true, "bitacora": true, "rellenoHoja": true, "filaOpciones": 3, "preguntaDosColumnas": 130, "retro": {"reacciones": ["u2-dialogo.webp", "u1-escalera.webp"], "frases": ["¿Seguro?", "¡Revise de nuevo!", "¡Mire otra vez!", "¡Casi!"], "acierto": ["manos-choque.webp"], "rotulo": "Unidad 1 · Lección 1.3"}, "leccion_rotulo": "Lección 1.3", "unit": 1, "lesson": 3, "heading": "Lección 1.3. Actores de la justicia restaurativa", "scenes": [{"layout": "fichas", "segmentos": ["La justicia restaurativa invita a que se comprenda que el proceso judicial no debe limitarse a buscar que la persona agresora reconozca su responsabilidad y reciba un determinado castigo, sino que esta entienda el impacto, los efectos, de su conducta punible para que, en paralelo, su reparación sea coherente con una comprensión de lo sucedido. Asimismo, la justicia restaurativa también invita a tener en cuenta las necesidades del indiciado o procesado. Necesidades que deben ser consideradas para materializar efectivamente la comprensión del daño cometido, la no repetición de lo sucedido y la reintegración a la sociedad.", "Desde este enfoque, se promueve que la persona ofensora participe activamente en el proceso restaurativos, especialmente en sus escenarios o prácticas."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Las necesidades del indiciado o procesado", "segs": [0], "obj": "personas"}, {"label": "Participe activamente", "segs": [1], "obj": "documento"}]}], "rotulo": null, "seccion": "1.3.1. Ofensor", "grupo": null, "titulos_fuente": ["1.3.1. Ofensor"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Las necesidades del indiciado o procesado", "Participe activamente"], "titulo_genially": "Ofensor", "complemento_genially": "", "apartado": "1.3.1. Ofensor", "ilustracion": "jr-u1-l3-e01.webp", "bloques_fuente": [193, 194]}, {"layout": "esquema", "segmentos": ["Las víctimas son el centro del proceso restaurativo y, por tanto, tienen derecho a participar proactivamente, ser escuchadas, recibir información, acceder a la justicia y obtener reparación. Es preciso tener presente que, no todas las personas víctimas son iguales y es importante comprender sus necesidades específicas frente al caso.", "Se deben analizar las necesidades reales de las víctimas y ajustar las respuestas a lo que es posible y adecuado en cada caso. Su relato ayuda a entender el contexto, construir la verdad, orientar las decisiones jurídicas y generar empatía en el proceso restaurativo. Las personas víctimas no son solo receptoras de reparación, sino que pueden proponer cómo quieren ser reparadas, participando activamente en la construcción de soluciones junto con el sistema de justicia."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Derecho a participar proactivamente", "segs": [0], "obj": "escudo"}, {"label": "Proponer cómo quieren ser reparadas", "segs": [1], "obj": "personas"}]}], "rotulo": null, "seccion": "1.3.2. Víctima", "grupo": null, "titulos_fuente": ["1.3.2. Víctima"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Derecho a participar proactivamente", "Proponer cómo quieren ser reparadas"], "titulo_genially": "Víctima", "complemento_genially": "", "apartado": "1.3.2. Víctima", "ilustracion": "jr-u1-l3-e02.webp", "arte": {"img": "jr-u1-l3-e02.webp", "pos": "fondo"}, "escenario": {"bioma": "barrio", "camino": "asciende"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "bloques_fuente": [196, 197]}, {"layout": "giro", "segmentos": ["La comunidad es un actor clave en la justicia restaurativa, porque no solo acompaña, sino que también participa en la solución de los conflictos. Está formada por personas cercanas a las víctimas o a los ofensores, como familias, líderes sociales, organizaciones o personas del territorio.", "En los procesos restaurativos, la comunidad cumple varios roles importantes. Primero, actúa como apoyo emocional, ayudando a crear confianza y a facilitar el diálogo entre las partes. Segundo, tiene la capacidad de proponer soluciones, aportando ideas para la reparación y la reconstrucción de las relaciones. Y tercero, funciona como veedor, es decir, ayuda a verificar que los acuerdos restaurativos se cumplan y que no se repitan los hechos.", "Además, en casos más complejos, como los relacionados con conflictos armados o violaciones de derechos humanos, la comunidad también participa en la construcción de la verdad y en el acompañamiento a las víctimas. Por ejemplo, observar en el material complementario de la presente unidad el video de la Jurisdicción Especial para la Paz."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "giro", "items": [{"label": "No solo acompaña, sino que también participa", "segs": [0], "obj": "escudo"}, {"label": "La comunidad cumple varios roles importantes", "segs": [1], "obj": "documento"}, {"label": "La construcción de la verdad", "segs": [2], "obj": "camara"}]}], "rotulo": null, "seccion": "1.3.3. Comunidad", "grupo": null, "titulos_fuente": ["1.3.3. Comunidad"], "encabezados": [], "mediacion": "Tarjetas que giran: cada una abre su texto completo.", "rotulos": ["No solo acompaña, sino que también participa", "La comunidad cumple varios roles importantes", "La construcción de la verdad"], "titulo_genially": "Comunidad", "complemento_genially": "", "apartado": "1.3.3. Comunidad", "ilustracion": "jr-u1-l3-e03.webp", "arte": {"img": "jr-u1-l3-e03.webp", "pos": "izq"}, "bloques_fuente": [199, 201]}]}</script>
