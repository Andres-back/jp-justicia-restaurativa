e, se promueve que la persona ofensora participe activamente en el proceso restaurativos, especialmente en sus escenarios o prácticas."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compara", "items": [{"label": "Las necesidades del indiciado o procesado", "segs": [0], "obj": "personas"}, {"label": "Participe activamente", "segs": [1], "obj": "documento"}]}], "rotulo": null, "seccion": "1.3.1. Ofensor", "grupo": null, "titulos_fuente": ["1.3.1. Ofensor"], "encabezados": [], "mediacion": "Comparador: columnas lado a lado; la que se toca se ensancha con su texto completo.", "rotulos": ["Las necesidades del indiciado o procesado", "Participe activamente"], "titulo_genially": "Actores de la justicia restaurativa", "complemento_genially": "", "apartado": "1.3.1. Ofensor", "ilustracion": "jr-u1-l3-e01.webp", "arte": {"img": "jr-u1-l3-e01.webp", "pos": "fondo"}, "pagina": 1, "parte": 1, "partes": 3, "pestana": "Ofensor", "letra": "1.3.1", "bloques_fuente": [193, 194]}, {"layout": "carrusel", "segmentos": ["Las víctimas son el centro del proceso restaurativo y, por tanto, tienen derecho a participar proactivamente, ser escuchadas, recibir información, acceder a la justicia y obtener reparación. Es preciso tener presente que, no todas las personas víctimas son iguales y es importante comprender sus necesidades específicas frente al caso.", "Se deben analizar las necesidades reales de las víctimas y ajustar las respuestas a lo que es posible y adecuado en cada caso. Su relato ayuda a entender el contexto, construir la verdad, orientar las decisiones jurídicas y generar empatía en el proceso restaurativo. Las personas víctimas no son solo receptoras de reparación, sino que pueden proponer cómo quieren ser reparadas, participando activamente en la construcción de soluciones junto con el sistema de justicia."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "carrusel", "items": [{"label": "Derecho a participar proactivamente", "segs": [0], "obj": "escudo"}, {"label": "Proponer cómo quieren ser reparadas", "segs": [1], "obj": "personas"}]}], "rotulo": null, "seccion": "1.3.2. Víctima", "grupo": null, "titulos_fuente": ["1.3.2. Víctima"], "encabezados": [], "mediacion": "Carrusel narrativo", "rotulos": ["Derecho a participar proactivamente", "Proponer cómo quieren ser reparadas"], "titulo_genially": "Actores de la justicia restaurativa", "complemento_genially": "", "apartado": "1.3.2. Víctima", "ilustracion": "jr-u1-l3-e02.webp", "pagina": 1, "parte": 2, "partes": 3, "pestana": "Víctima", "letra": "1.3.2", "bloques_fuente": [196, 197]}, {"layout": "piramide", "segmentos": ["La comunidad es un actor clave en la justicia restaurativa, porque no solo acompaña, sino que también participa en la solución de los conflictos. Está formada por personas cercanas a las víctimas o a los ofensores, como familias, líderes sociales, organizaciones o personas del territorio.", "En los procesos restaurativos, la comunidad cumple varios roles importantes. Primero, actúa como apoyo emocional, ayudando a crear confianza y a facilitar el diálogo entre las partes. Segundo, tiene la capacidad de proponer soluciones, aportando ideas para la reparación y la reconstrucción de las relaciones. Y tercero, funciona como veedor, es decir, ayuda a verificar que los acuerdos restaurativos se cumplan y que no se repitan los hechos.", "Además, en casos más complejos, como los relacionados con conflictos armados o violaciones de derechos humanos, la comunidad también participa en la construcción de la verdad y en el acompañamiento a las víctimas. Por ejemplo, observar en el material complementario de la presente unidad el video de la Jurisdicción Especial para la Paz."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "piramide", "items": [{"label": "No solo acompaña, sino que también participa", "seg
