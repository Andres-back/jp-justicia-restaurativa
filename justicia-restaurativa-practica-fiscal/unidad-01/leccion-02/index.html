<script type="application/json" id="contenido">{"ilustraciones": "ilustraciones-restaurativa", "paleta": {"marino": "#1E4260", "teal": "#486781", "oxido": "#B5563D", "coral": "#D16C4B", "crema": "#F2D1CD", "niebla": "#D2DAE2", "hielo": "#ECD5CF", "celeste": "#738CA3", "madera": "#853629", "piso": "#D1A29C", "gris": "#8FA3B5", "amarillo": "#E3A793"}, "anclas": {}, "respiro": 360, "pagina": 500, "partesSiNoCabe": true, "letraCompleta": 14, "letraMax": 15, "entradaVisible": true, "ventanaSinRepetir": true, "extractoMin": 240, "juego": {"clave": "jr-juego-u1-l2", "niveles": ["Observador", "Analista", "Facilitador", "Constructor de acuerdos"], "logroActividad": "¡Logro: actividad resuelta!"}, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "jr", "partirComas": true, "bitacora": true, "rellenoHoja": true, "filaOpciones": 3, "preguntaDosColumnas": 130, "retro": {"reacciones": ["u2-dialogo.webp", "u1-escalera.webp"], "frases": ["¿Seguro?", "¡Revise de nuevo!", "¡Mire otra vez!", "¡Casi!"], "acierto": ["manos-choque.webp"], "rotulo": "Unidad 1 · Lección 1.2"}, "leccion_rotulo": "Lección 1.2", "paginas": [[0, 1, 2, 3, 4]], "ventanaAmplia": true, "articulos": [{"forma": "artículo 519, numerales 3 y 4 de la Ley 906 de 2004", "titulo": "Artículo 519 · Código de Procedimiento Penal (Ley 906 de 2004)", "explicaciones": [{"leccion": "Lección 1.1", "texto": "Se trata de un principio sine qua non de la aplicación de la justicia restaurativa, recogido por el legislador colombiano, dada su imprescindibilidad, en dos reglas (artículos 519, numeral 1, y 520, núm. 2, del CPP). Los procesos de justicia restaurativa requieren de la voluntad de las partes, no a través de una verificación formal, sino de la verificación permanente de la inexistencia de situaciones o circunstancias que afecten, alteren o transgredan ese consentimiento, libertad o voluntad3."}, {"leccion": "Lección 1.1", "texto": "Se sugiere en el material complementario del curso revisar el marco general en: Ospina, 2015, pp. 75-80; adaptando las referencias específicas a otra institución al contexto de la justicia restaurativa para sus participantes, no solo para el procesado; a modo de ejemplo, el soporte normativo del asesoramiento técnico de una o un abogado (en la justicia restaurativa) corresponde al artículo 519, numeral 6, del CPP."}, {"leccion": "Lección 2.1", "texto": "Los artículos 518 y 519 incorporan, además, conceptos como resultado restaurativo, necesidades y responsabilidades individuales y colectivas, reintegración, reparación, restitución y servicio a la comunidad."}], "tambien": ["Lección 1.1", "Lección 1.2", "Lección 2.1"]}], "unit": 1, "lesson": 2, "heading": "Lección 1.2. El conflicto y el contexto", "scenes": [{"layout": "esquema", "segmentos": ["Los conflictos pueden clasificarse según la gravedad del daño (baja, media o alta lesividad), lo que ayuda a elegir la mejor forma de intervenir. Es clave que, de cara a un conflicto, sea posible crear espacios seguros donde las personas puedan hablar, ser escuchadas y construir soluciones. Pero, para ello, es necesario distinguir e identificar las condiciones concretas de cada conflicto.", "La justicia restaurativa propone entender el conflicto de manera más completa a través de cuatro ideas principales:", "El delito como daño: las consecuencias del delito producen afectaciones a personas y relaciones.", "El análisis de las relaciones: el conflicto se entiende dentro de un contexto social y de relaciones.", "La posibilidad de cambio: las personas pueden aprender, asumir las consecuencias de su actuar y transformarse.", "La justicia como reparación: lo importante no es solo castigar, sino reparar el daño causado.", "Un cirujano realiza un procedimiento sin el cumplimiento de la lex artis, causando daños graves a la paciente. Desde un enfoque restaurativo, no se trata de concentrarse en la conducta punible, sino e el daño generado, promoviendo la responsabilización y las acciones de reparación hacia la víctima."], "parrafo": [0, 1, 2, 3, 4, 5, 6], "vineta": [2, 3, 4, 5], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Las condiciones concretas de cada conflicto", "segs": [0], "obj": "reloj"}, {"label": "Cuatro ideas principales", "segs": [1, 2, 3, 4, 5], "obj": "lupa"}, {"label": "El daño generado", "segs": [6], "obj": "escudo"}]}], "rotulo": null, "seccion": "Lección 1.2. El conflicto y el contexto", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Las condiciones concretas de cada conflicto", "Cuatro ideas principales", "El daño generado"], "titulo_genially": "El conflicto y el contexto", "complemento_genially": "", "apartado": "", "ilustracion": "jr-u1-l2-e01.webp", "arte": {"img": "jr-u1-l2-e01.webp", "pos": "fondo"}, "pagina": 1, "parte": 1, "partes": 5, "pestana": "Clasificación de los conflictos", "bloques_fuente": [164, 170]}, {"layout": "mental", "segmentos": ["El daño y el impacto son aspectos clave para entender las consecuencias de un delito. El daño es lo que se pierde o se afecta (por ejemplo, dinero, salud o tranquilidad), mientras que el impacto es cómo ese daño cambia la vida de la persona o la comunidad. Esto incluye cambios emocionales, familiares o sociales. Ambos elementos ayudan a comprender mejor lo ocurrido y a orientar una respuesta más justa.", "Identificar el daño es fundamental porque todo delito genera algún tipo de afectación. Por eso, la Fiscalía debe reconocer y entender esos daños para poder actuar de manera adecuada y buscar su reparación, teniendo en cuenta a las víctimas. Para lograrlo, la participación de las víctimas es clave, ya que ellas pueden explicar cómo el hecho transformó su vida.", "Una persona publicó en redes sociales mensajes intimidantes y una imagen que amenazaban la vida de una profesional reconocida por su labor pública. Aunque los mensajes fueron eliminados poco después, el daño ya se había producido: la víctima vio afectada su tranquilidad, su seguridad personal y su reputación profesional. Sin embargo, más allá del daño inmediato, el impacto fue más profundo, ya que generó temor constante, preocupación por la seguridad de su familia y afectaciones en el ejercicio de su trabajo, que depende de la confianza pública.", "Este caso evidencia que no basta con identificar el daño, sino también comprender su impacto, para orientar respuestas que reparen a la víctima y eviten nuevas afectaciones."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mental", "items": [{"label": "El daño es lo que se pierde o se afecta", "segs": [0], "obj": "reloj"}, {"label": "Reconocer y entender esos daños", "segs": [1], "obj": "escudo"}, {"label": "Más allá del daño inmediato", "segs": [2, 3], "obj": "camara"}]}], "rotulo": null, "seccion": "1.2.1. El daño y el impacto", "grupo": null, "titulos_fuente": ["1.2.1. El daño y el impacto"], "encabezados": [], "mediacion": "Mapa mental: la idea central y sus ramas; cada rama abre su texto completo.", "rotulos": ["El daño es lo que se pierde o se afecta", "Reconocer y entender esos daños", "Más allá del daño inmediato"], "titulo_genially": "El conflicto y el contexto", "complemento_genially": "", "apartado": "1.2.1. El daño y el impacto", "ilustracion": "jr-u1-l2-e02.webp", "arte": {"img": "jr-u1-l2-e02.webp", "pos": "centro"}, "pagina": 1, "parte": 2, "partes": 5, "pestana": "El daño y el impacto", "letra": "1.2.1", "bloques_fuente": [172, 175]}, {"layout": "esquema", "segmentos": ["El contexto es todo lo que rodea un delito: el o los lugares en donde se desarrolla, las condiciones sociales, las situaciones de vida de quienes están involucrados y las relaciones entre las personas. Entender el contexto es clave porque permite ver el problema de manera más completa, no solo como un hecho aislado.", "Esto no significa justificar el delito, sino comprender mejor por qué ocurrió y cómo afectó a las personas y a la comunidad. Gracias a esto, se pueden tomar decisiones más justas, promover que la persona ofensora reconozca lo que hizo, reparar a la víctima y evitar que el daño se repita. Además, ayuda a que la actuación sea más respetuosa con la víctima y evite nuevas afectaciones (revictimización).", "Cuando el fiscal entiende el contexto, puede actuar mejor en dos sentidos:", "Dar un trato adecuado y respetuoso a la víctima y su entorno.", "Sensibilizar en torno de la responsabilización del ofensor, siendo respetuoso de las garantías propias del derecho a la defensa. Para el efecto, el o la fiscal, le podrá recordar a la defensa que las conversaciones que se sostienen durante las acciones, prácticas o espacios restaurativos de ninguna forma podrán ser utilizados en su contra. Con un claro y contundente sustento normativo: artículo 8, literal d), así como el artículo 519, numerales 3 y 4 de la Ley 906 de 2004."], "parrafo": [0, 1, 2, 3, 4], "vineta": [3, 4], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Todo lo que rodea un delito", "segs": [0], "obj": "personas"}, {"label": "Comprender mejor por qué ocurrió", "segs": [1], "obj": "reloj"}, {"label": "Actuar mejor en dos sentidos", "segs": [2, 3, 4], "obj": "escudo"}]}], "rotulo": null, "seccion": "1.2.2. El contexto de los delitos", "grupo": null, "titulos_fuente": ["1.2.2. El contexto de los delitos"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Todo lo que rodea un delito", "Comprender mejor por qué ocurrió", "Actuar mejor en dos sentidos"], "titulo_genially": "El conflicto y el contexto", "complemento_genially": "", "apartado": "1.2.2. El contexto de los delitos", "objeto_raiz": "personas", "objetos_raiz": ["personas", "documento", "carpetas"], "pagina": 1, "parte": 3, "partes": 5, "pestana": "El contexto de los delitos", "letra": "1.2.2", "bloques_fuente": [177, 181]}, {"layout": "compara", "segmentos": ["Un ejemplo para analizar cómo se articula el conflicto y su contexto en la justicia restaurativa es el de Ruanda. Los tribunales Gacaca en Ruanda surgieron como una respuesta comunitaria tras el genocidio contra los tutsis de 1994. Ruanda enfrentaba cientos de miles de personas vinculadas con los crímenes y un sistema judicial incapaz de procesarlas rápidamente. El Estado recuperó y transformó la tradición de la Gacaca, convirtiéndola en un mecanismo comunitario para abordar los crímenes del genocidio. Sus objetivos incluían conocer la verdad, combatir la impunidad, promover la reconciliación, reconstruir las relaciones comunitarias y permitir que la propia comunidad participe en la resolución de sus problemas.", "En estos tribunales, la respuesta al delito no se concentraba exclusivamente en castigar al responsable, sino también en comprender el daño, escuchar a quienes habían sido afectados, promover el reconocimiento de responsabilidad, facilitar confesiones y disculpas, y procurar la reintegración del responsable y la reconstrucción del tejido social. En determinados casos existían además formas de reparación y trabajo comunitario.", "Este modelo permite comprender que el conflicto no se limita al hecho delictivo individual, sino que está profundamente determinado por factores históricos, sociales y comunitarios que condicionan tanto su origen como su resolución."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compara", "items": [{"label": "Una respuesta comunitaria", "segs": [0], "obj": "tribunal"}, {"label": "La reconstrucción del tejido social", "segs": [1], "obj": "reloj"}, {"label": "Factores históricos, sociales y comunitarios", "segs": [2], "obj": "documento"}]}], "rotulo": null, "seccion": "1.2.2. El contexto de los delitos", "grupo": null, "titulos_fuente": ["1.2.2. El contexto de los delitos"], "encabezados": [], "mediacion": "Comparador: columnas lado a lado; la que se toca se ensancha con su texto completo.", "rotulos": ["Una respuesta comunitaria", "La reconstrucción del tejido social", "Factores históricos, sociales y comunitarios"], "titulo_genially": "El conflicto y el contexto", "complemento_genially": "", "apartado": "1.2.2. El contexto de los delitos", "ilustracion": "jr-u1-l2-e04.webp", "arte": {"img": "jr-u1-l2-e04.webp", "pos": "fondo"}, "pagina": 1, "parte": 4, "partes": 5, "pestana": "Los tribunales Gacaca en Ruanda", "bloques_fuente": [182, 184]}, {"layout": "esquema", "segmentos": ["La lesividad y la conflictividad son dos elementos clave para entender el delito desde la justicia restaurativa. La lesividad se refiere al nivel de daño causado, mientras que la conflictividad permite entender el contexto social y relacional del problema. Ambos conceptos se complementan: uno muestra qué tan grave fue el daño y el otro explica por qué ocurrió el conflicto. Este análisis ayuda a tomar decisiones más justas, teniendo en cuenta las necesidades de las víctimas, las capacidades de reparación y el contexto del delito.", "Los delitos pueden clasificarse según su nivel de lesividad (bajo, medio o alto), lo que ayuda a definir qué tipo de respuesta es más adecuada. Esta clasificación permite al fiscal acercarse al conflicto y analizar qué mecanismos restaurativos aplicar, asegurando que la respuesta sea proporcional al daño causado y útil para las personas involucradas y la sociedad.", "El enfoque de conflictividad complementa el análisis al preguntarse cómo se originó el delito. Por eso, no solo importa la gravedad del daño, sino también cómo se originó y cómo afecta las relaciones entre las personas y la comunidad.", "Este enfoque permite entender mejor los casos, ya sean hechos individuales o parte de problemas más grandes, y ayuda a identificar mejores formas de reparación y acceso a la justicia. Aunque no es obligatorio aplicarlo, es muy útil para lograr soluciones más completas.", "Ejemplo: En un proceso por el delito de lesiones personales dolosas con secuelas permanentes (no querellables) el fiscal analiza: Desde la lesividad, se determinan las consecuencias en la integridad personal o la salud. Desde la conflictividad, el fiscal identifica que el hecho no fue aislado, sino que se originó en un conflicto previo entre compañeros de trabajo, el cual ha generado discusiones y tensiones en la empresa en donde laboran, con riesgo de repetición. Con base en este análisis conjunto, y en aplicación de los principios de discrecionalidad y legalidad, el fiscal evalúa la viabilidad de un mecanismo de justicia restaurativa"], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Ambos conceptos se complementan", "segs": [0], "obj": "reloj"}, {"label": "Qué tipo de respuesta es más adecuada", "segs": [1], "obj": "personas"}, {"label": "Cómo se originó el delito", "segs": [2, 3], "obj": "lupa"}, {"label": "Lesiones personales dolosas con secuelas permanentes", "segs": [4], "obj": "corazon"}]}], "rotulo": null, "seccion": "1.2.3. La lesividad y la conflictividad", "grupo": null, "titulos_fuente": ["1.2.3. La lesividad y la conflictividad"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Ambos conceptos se complementan", "Qué tipo de respuesta es más adecuada", "Cómo se originó el delito", "Lesiones personales dolosas con secuelas permanentes"], "titulo_genially": "El conflicto y el contexto", "complemento_genially": "", "apartado": "1.2.3. La lesividad y la conflictividad", "ilustracion": "jr-u1-l2-e05.webp", "arte": {"img": "jr-u1-l2-e05.webp", "pos": "izq"}, "pagina": 1, "parte": 5, "partes": 5, "pestana": "La lesividad y la conflictividad", "letra": "1.2.3", "bloques_fuente": [186, 190]}]}</script>
